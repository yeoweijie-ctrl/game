#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px}
#mc-screen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,0.6);z-index:20}
#mc-screen.open{display:flex}
.mc-window{background:#c6c6c6;padding:12px;border:4px solid #555;box-shadow:4px 4px 0 rgba(0,0,0,0.5);display:flex;flex-direction:column;gap:8px}
.mc-slot{width:40px;height:40px;background:#8b8b8b;border-top:3px solid #373737;border-left:3px solid #373737;border-right:3px solid #fff;border-bottom:3px solid #fff;box-shadow:inset 0 0 0 1px #000;margin:1px;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mc-slot.out-slot{background:#9b9b9b}
.mc-slot:hover{filter:brightness(1.15)}
.mc-item{width:24px;height:24px;transform:rotate(45deg);border:1px solid rgba(0,0,0,0.4);pointer-events:none}
.mc-count{position:absolute;bottom:-4px;right:0;font-size:16px;font-weight:bold;color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none}
.mc-tag{position:absolute;top:-2px;left:1px;font-size:7px;color:#fff;text-shadow:1px 1px 0 #000;pointer-events:none;transform:none;font-weight:bold}
.mc-row{display:flex;gap:4px;justify-content:center;align-items:center}
.mc-col{display:flex;flex-direction:column;gap:4px;justify-content:center}
.mc-spacer{width:20px}
.mc-grid-2x2{display:grid;grid-template-columns:repeat(2,40px);grid-template-rows:repeat(2,40px);gap:2px}
.mc-grid-3x3{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:2px}
.mc-main-inv{display:grid;grid-template-columns:repeat(9,40px);grid-template-rows:repeat(3,40px);gap:2px}
#mc-hotbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(9,40px);grid-template-rows:40px;gap:2px;background:rgba(198,198,198,0.9);padding:10px;border:4px solid #555;box-shadow:4px 4px 0 rgba(0,0,0,0.5);z-index:10}
.mc-slot.selected{border-color:#fff;box-shadow:0 0 0 2px #fff,inset 0 0 0 1px #000;outline:2px solid #fff}
#drag-ghost{position:absolute;pointer-events:none;z-index:1000;display:none}
#tooltip{position:absolute;pointer-events:none;z-index:2000;display:none;background:#100010;border:2px solid #500050;color:#fff;padding:4px 8px;font-size:13px;white-space:nowrap}
.mc-help{color:#404040;font-size:10px;text-align:center;padding:4px;border-top:2px solid #999;margin-top:4px;line-height:1.4}
#mine-fb{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);color:#ff4444;font-size:14px;font-weight:bold;text-shadow:1px 1px 2px #000;pointer-events:none;z-index:10;opacity:0;transition:opacity 0.3s}
</style>

function mr(gi,gs,rec){
  var g2=[];for(var r=0;r<gs;r++){g2[r]=[];for(var c=0;c<gs;c++){var it=gi[r*gs+c];g2[r][c]=it?it.type:0;}}
  var ps=rec.size,pp=rec.pat,p2=[];for(var r=0;r<ps;r++){p2[r]=[];for(var c=0;c<ps;c++){p2[r][c]=pp[r*ps+c];}}
  var a=ps,b=-1,e=ps,f=-1;
  for(var r=0;r<ps;r++){for(var c=0;c<ps;c++){if(p2[r][c]!==0){if(r<a)a=r;if(r>b)b=r;if(c<e)e=c;if(c>f)f=c;}}}
  if(b===-1)return false;var rh=b-a+1,rw=f-e+1;if(rh>gs||rw>gs)return false;
  var g=gs,h=-1,j=gs,k=-1;
  for(var r=0;r<gs;r++){for(var c=0;c<gs;c++){if(g2[r][c]!==0){if(r<g)g=r;if(r>h)h=r;if(c<j)j=c;if(c>k)k=c;}}}
  if(h===-1)return false;var gh=h-g+1,gw=k-j+1;if(rh!==gh||rw!==gw)return false;
  for(var r=0;r<rh;r++){for(var c=0;c<rw;c++){if(g2[g+r][j+c]!==p2[a+r][e+c])return false;}}
  return true;
}

// ===== BIOME SYSTEM =====
var biomeCenters=[];
function initBiomes(){
  biomeCenters=[];
  var n=12;
  for(var i=0;i<n;i++){
    biomeCenters.push({
      x:Math.floor(Math.random()*MAP_W),
      y:Math.floor(Math.random()*MAP_H),
      type:i%2===0?'stone':'wood'
    });
  }
  // Ensure spawn area is wood biome
  biomeCenters.push({x:Math.floor(MAP_W/2),y:Math.floor(MAP_H/2),type:'wood'});
}
function getBiome(x,y){
  var md=1e9,bt='wood';
  for(var i=0;i<biomeCenters.length;i++){
    var d=Math.hypot(x-biomeCenters[i].x,y-biomeCenters[i].y);
    if(d<md){md=d;bt=biomeCenters[i].type;}
  }
  return bt;
}
function applyBiomes(){
  for(var x=2;x<MAP_W-2;x++){for(var y=2;y<MAP_H-2;y++){
    var b=getBiome(x,y);
    if(b==='stone'){
      // Densify: fill some open floor near walls
      if(map[x][y]===1){
        var wn=0;for(var dx=-1;dx<=1;dx++){for(var dy=-1;dy<=1;dy++){var nx=x+dx,ny=y+dy;if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&(map[nx][ny]===0||map[nx][ny]===8||map[nx][ny]===9||map[nx][ny]===10))wn++;}}
        if(wn>=3&&Math.random()<0.4)map[x][y]=0;
      }
      // Remove surface features
      if(map[x][y]===20||map[x][y]===3)map[x][y]=0;
      if(map[x][y]===2)map[x][y]=1;
    }else{
      // Open up: remove some walls near open floor
      if(map[x][y]===0){
        var fn=0;for(var dx=-1;dx<=1;dx++){for(var dy=-1;dy<=1;dy++){var nx=x+dx,ny=y+dy;if(nx>=0&&nx<MAP_W&&ny>=0&&ny<MAP_H&&map[nx][ny]===1)fn++;}}
        if(fn>=3&&Math.random()<0.2)map[x][y]=1;
      }
      // Remove ores
      if(map[x][y]===8||map[x][y]===9||map[x][y]===10)map[x][y]=0;
    }
  }}
}

      if(tile===2){adx=dx*WATER_SPEED_MULT;ady=dy*WATER_SPEED_MULT;}
      else if(tile===0||tile>=3){
        var tx=Math.floor((pwx+dx)/TILE_SIZE),ty=Math.floor((pwy+dy)/TILE_SIZE);
        if(tx>=0&&tx<MAP_W&&ty>=0&&ty<MAP_H){
          var ti=inv[ss],tl=gtl(ti?ti.type:0),bl=gbl(tile);
          if(tl>=bl){adx=dx*MINING_SPEED_MULT;ady=dy*MINING_SPEED_MULT;var dr=gmd(tile);if(dr>0)sDI(tx,ty,dr);map[tx][ty]=1;}
          else{adx=0;ady=0;mfX='Need '+gtn(bl)+' to mine '+gn(tile)+'!';mfT=90;}
        }
      }
      camera.x+=adx;camera.y+=ady;
    }
  }
  camera.x=Math.max(0,Math.min(camera.x,MAP_W*TILE_SIZE-vw()));camera.y=Math.max(0,Math.min(camera.y,MAP_H*TILE_SIZE-vh()));
  if(keys['c']&&!cP){if(aUI==='crafting'){cUI();}else{var ht=false;for(var i=0;i<36;i++){if(inv[i]&&inv[i].type===7){ht=true;break;}}if(ht){if(aUI==='inventory')cUI();oUI('crafting');}else{mfX='No Crafting Table in inventory!';mfT=90;}}}cP=keys['c'];
  if(mfT>0){mfT--;mF.textContent=mfX;mF.style.opacity='1';}else{mF.style.opacity='0';}
  var cwx=camera.x+vw()/2,cwy=camera.y+vh()/2;
  for(var i=di2.length-1;i>=0;i--){var it=di2[i];it.x+=it.vx;it.y+=it.vy;it.vx*=0.9;it.vy*=0.9;it.life=Math.min(it.life+0.1,1);var ds=Math.hypot(it.x-cwx,it.y-cwy);if(ds<30){if(aII(it.type))di2.splice(i,1);}}
  var pt='X:'+Math.floor(camera.x/TILE_SIZE)+' Y:'+Math.floor(camera.y/TILE_SIZE)+' '+mode;
  var ti=inv[ss];if(ti)pt+=' | '+gn(ti.type);
  var ht=false;for(var i=0;i<36;i++){if(inv[i]&&inv[i].type===7){ht=true;break;}}if(ht)pt+=' | C:Craft';
  document.getElementById('pos').innerText=pt;
}

// ===== DRAW =====
function draw(){
  if(generating)return;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
  var z=zsc();ctx.setTransform(z,0,0,z,0,0);
  var sx=Math.floor(camera.x/TILE_SIZE),sy=Math.floor(camera.y/TILE_SIZE);
  var ex=Math.ceil((camera.x+vw())/TILE_SIZE),ey=Math.ceil((camera.y+vh())/TILE_SIZE);
  sx=Math.max(0,sx);sy=Math.max(0,sy);ex=Math.min(MAP_W,ex);ey=Math.min(MAP_H,ey);
  for(var x=sx;x<ex;x++){for(var y=sy;y<ey;y++){var px=x*TILE_SIZE-camera.x,py=y*TILE_SIZE-camera.y,v=map[x][y];
    if(v===1){ctx.fillStyle='#e8e8e8';ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE);}
    else if(v===2){ctx.fillStyle='#1a8fd4';ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE);}
    else if(v===0){ctx.fillStyle='#555';ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE);}
    else if(v===3){ctx.fillStyle='#9B7653';ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE);}
    else if(v===8){ctx.fillStyle='#333';ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE);}
    else if(v===9){ctx.fillStyle='#D4D4D4';ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE);}
    else if(v===10){ctx.fillStyle='#00E5FF';ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE);}
    else if(v===20){ctx.fillStyle='#8B5A2B';ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE);}
  }}
  for(var i=0;i<di2.length;i++){var it=di2[i];var scX=it.x-camera.x,scY=it.y-camera.y;if(scX<-20||scX>vw()+20||scY<-20||scY>vh()+20)continue;var sz=12*it.life;ctx.save();ctx.translate(scX,scY);ctx.rotate(Math.PI/4);ctx.fillStyle=gc(it.type);ctx.fillRect(-sz/2,-sz/2,sz,sz);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(-sz/2,-sz/2,sz,sz);ctx.restore();}
  var cx=vw()/2,cy=vh()/2;ctx.fillStyle='red';ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fill();
  var ti=inv[ss],tl=gtl(ti?ti.type:0);if(tl>0){ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='10px monospace';ctx.fillText(gtn(tl),cx-20,cy-12);}
}

function gameLoop(){update();draw();requestAnimationFrame(gameLoop);}

setTimeout(function(){
  initMap();rCA();cWT();cSR();pDirt();gLk();eSW();sWE();pOre();gFor();initBiomes();applyBiomes();
  inv[0]={type:7,count:1};
  generating=false;
  document.getElementById('loading').style.display='none';
  uV();gameLoop();
},50);
</script>
