<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Cave Generation - Organic Lakes</title>
   <style>
       body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; user-select: none; }
       canvas { display: block; }
       
       #ui { position: absolute; top: 20px; left: 20px; color: #fff; pointer-events: none; text-shadow: 1px 1px 2px black; z-index: 10; }
       #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; font-family: sans-serif; }
       
       /* Minecraft UI Container */
       #mc-screen {
           position: absolute;
           top: 0; left: 0; width: 100%; height: 100%;
           display: none;
           justify-content: center;
           align-items: center;
           background: rgba(0,0,0,0.4);
           z-index: 20;
       }
       #mc-screen.open { display: flex; }


       /* Main Window (Inventory / Crafting Table) */
       .mc-window {
           background: #c6c6c6;
           padding: 10px;
           border: 4px solid #555;
           box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
           display: flex;
           flex-direction: column;
           gap: 10px;
           image-rendering: pixelated;
       }


       /* Generic Slot */
       .mc-slot {
           width: 40px; height: 40px;
           background: #8b8b8b;
           border-top: 3px solid #373737;
           border-left: 3px solid #373737;
           border-right: 3px solid #ffffff;
           border-bottom: 3px solid #ffffff;
           box-shadow: inset 0 0 0 1px #000;
           margin: 1px;
           position: relative;
           display: flex; align-items: center; justify-content: center;
       }
       .mc-slot.out-slot { background: #9b9b9b; }
       
       .mc-item {
           width: 24px; height: 24px;
           transform: rotate(45deg);
           border: 1px solid rgba(0,0,0,0.4);
           pointer-events: none;
       }
       .mc-count {
           position: absolute;
           bottom: -4px; right: 0px;
           font-size: 16px; font-weight: bold;
           color: #fff;
           text-shadow: 2px 2px 0 #000;
           pointer-events: none;
       }


       /* Layout Helpers */
       .mc-row { display: flex; gap: 4px; justify-content: center; align-items: center; }
       .mc-col { display: flex; flex-direction: column; gap: 4px; justify-content: center; }
       .mc-spacer { width: 20px; }
       .mc-arrow { font-size: 24px; color: #555; font-weight: bold; }


       .mc-grid-2x2 { display: grid; grid-template-columns: repeat(2, 40px); grid-template-rows: repeat(2, 40px); gap: 2px; }
       .mc-grid-3x3 { display: grid; grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(3, 40px); gap: 2px; }
       .mc-main-inv { display: grid; grid-template-columns: repeat(9, 40px); grid-template-rows: repeat(3, 40px); gap: 2px; }
       
       /* Always-on Hotbar */
       #mc-hotbar {
           position: absolute;
           bottom: 20px; left: 50%;
           transform: translateX(-50%);
           display: grid;
           grid-template-columns: repeat(9, 40px);
           grid-template-rows: repeat(1, 40px);
           gap: 2px;
           background: rgba(198, 198, 198, 0.9);
           padding: 10px;
           border: 4px solid #555;
           box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
           z-index: 10;
       }
       .mc-slot.selected {
           border-color: #fff;
           box-shadow: 0 0 0 2px #fff, inset 0 0 0 1px #000;
           outline: 2px solid #fff;
       }


       /* Drag Ghost */
       #drag-ghost {
           position: absolute;
           pointer-events: none;
           z-index: 1000;
           display: none;
       }
       #drag-ghost .mc-item { transform: rotate(45deg) scale(1.1); }
   </style>
</head>

   // Tiles that count as "wall" (plain dirt, coal, iron, colored ores, placed dirt/stone blocks). Out-of-bounds = wall.
   // Torches (22), void floor (30), and stone floor (31) are NOT walls — they block movement
   // (void) or are walkable (stone floor) but don't block light.
   function isDirtBlock(x, y) {
       if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return true;
       const v = map[x][y];
       return v === 0 || v === 8 || v === 9 || (v >= 3 && v <= 6) || v === 21 || v === 25 || v === 30 || v === 34 || v === 38;
   }

           const len = Math.min(lightRayLength(pwx, pwy, a), playerLightR);   // world px, capped by biome radius
           const px = scx + Math.cos(a) * len * ZOOM, py = scy + Math.sin(a) * len * ZOOM;   // world px -> screen px
           if (i === 0) lightCtx.moveTo(px, py); else lightCtx.lineTo(px, py);
       }
       lightCtx.closePath();
       lightCtx.fill();
       // torch lights: each placed torch (tile 22) emits a circular light, same radius as the player.
       // Light rays (tile 36) emit a BIGGER light (1.6x radius) — they illuminate more of the meadow.
       // Rays cast from the torch/ray's world position so shadows are correct.
       const ptx0 = Math.floor((camera.x - camOffsetX) / TILE_SIZE) - 1;
       const pty0 = Math.floor((camera.y - camOffsetY) / TILE_SIZE) - 1;
       const ptx1 = Math.ceil((camera.x - camOffsetX + canvas.width / ZOOM) / TILE_SIZE) + 1;
       const pty1 = Math.ceil((camera.y - camOffsetY + canvas.height / ZOOM) / TILE_SIZE) + 1;
       for (let tx = Math.max(0, ptx0); tx < Math.min(MAP_W, ptx1); tx++) {
           for (let ty = Math.max(0, pty0); ty < Math.min(MAP_H, pty1); ty++) {
               const tileV = map[tx][ty];
               if (tileV !== 22) continue;   // torch only
               const isRay = tileV === 36;
               const lightR = isRay ? LIGHT_RADIUS * 1.6 : LIGHT_RADIUS;   // light rays illuminate more
               const twx = tx * TILE_SIZE + TILE_SIZE / 2, twy = ty * TILE_SIZE + TILE_SIZE / 2;
               const tsx = (twx - camera.x - camOffsetX) * ZOOM, tsy = (twy - camera.y - camOffsetY) * ZOOM;
               const tg = lightCtx.createRadialGradient(tsx, tsy, lightR * LIGHT_CORE * ZOOM, tsx, tsy, lightR * ZOOM);
               tg.addColorStop(0, 'rgba(0,0,0,1)');
               tg.addColorStop(1, 'rgba(0,0,0,0)');
               lightCtx.fillStyle = tg;
               lightCtx.beginPath();
               for (let i = 0; i < LIGHT_RAYS; i++) {
                   const a = (i / LIGHT_RAYS) * Math.PI * 2;
                   const len = Math.min(lightRayLength(twx, twy, a), lightR);
                   const px = tsx + Math.cos(a) * len * ZOOM, py = tsy + Math.sin(a) * len * ZOOM;

               lightCtx.closePath();
               lightCtx.fill();

       // 3. lay the darkness over the game
       ctx.save();
       ctx.setTransform(1, 0, 0, 1, 0, 0);
       ctx.drawImage(lightCanvas, 0, 0);
       ctx.restore();
   }

   // ==========================================
   // 🌊 PROCEDURAL LAKE WATER
   // ==========================================
   // 1. A shared field in WORLD coordinates shades every visible water tile, so tiles always join up.
   //    It mixes slow swells (whose strength, speed and patches keep changing) with ridged smooth
   //    noise for irregular, wider ripples. Nothing repeats exactly and nothing is random per frame.
   // 2. A foam pass draws a thick line along every water/land boundary. A surge travels along the

   const WATER_SAMPLE = 2;                              // world px per water pixel block (bigger = chunkier)

   const WATER_COARSE = 4;                              // the slow wave maths is evaluated every 4 px, then stepped up

   let waterLastT = -1;

   const WATER_RIDGES = [

       { sc: 104, dx: -2.1, dy: 2.7, zs: 0.034, z0: 27.9, w: 0.26, st: 0.80 },
       { sc: 47, dx: 1.5, dy: -3.0, zs: 0.065, z0: 43.1, w: 0.15, st: 0.50 }
   ];
   const WATER_DEEP = [11, 72, 106], WATER_MID = [18, 108, 146], WATER_SHALLOW = [46, 156, 184], WATER_GLINT = [128, 224, 240];
   // Stepped palette (pixel-art look): 8 water tones from deep to shallow, plus two ripple highlight tones for each.
   const WATER_LEVELS = 8;
   const WATER_PAL = [], WATER_PAL_HL1 = [], WATER_PAL_HL2 = [];
   (function () {
       const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

       }
   })();

   function isWaterLand(x, y) {                         // anything that is not water counts as shore
       if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return false;
       return map[x][y] !== 2;
   }

   // Colour every pixel block of the visible water tiles into one small image.
   // The slow wave maths is evaluated on a coarse 4px grid per tile (cheap), then every 2px block takes
   // the interpolated value and snaps it to a palette step with a fixed dither. Result: blocky pixel
   // art whose pixels step smoothly with time, instead of a blurry gradient.
   function prepareWater(startX, startY, endX, endY) {
       const f = waterField, T = TILE_SIZE, N = WATER_TS, C = WATER_COARSE, CN = T / C + 1;   // CN = coarse points per side (9)
       const tw = endX - startX + 2, th = endY - startY + 2;
       if (tw <= 0 || th <= 0) { f.ready = false; return; }
       // The water moves slowly, so it is refreshed ~30 times a second (and at once if the view moves to new tiles).
       const sameView = f.ox === startX - 1 && f.oy === startY - 1 && f.tw === tw && f.th === th;
       if (sameView && f.ready && waterTime / 1000 - f.lastT < 0.033) return;
       f.lastT = waterTime / 1000;
       f.ox = startX - 1; f.oy = startY - 1;
       if (f.tw !== tw || f.th !== th) {
           f.tw = tw; f.th = th;
           f.canvas.width = tw * N; f.canvas.height = th * N;
           f.img = f.ctx.createImageData(tw * N, th * N);
       }
       let any = false;
       for (let x = startX; x < endX && !any; x++) for (let y = startY; y < endY; y++) if (map[x][y] === 2) { any = true; break; }
       f.ready = any;
       if (!any) return;

       // ---- per-frame wave state (cheap, shared by every sample) ----
       const now = waterTime / 1000;
       const dt = waterLastT < 0 ? 0 : Math.min(0.1, Math.max(0, now - waterLastT));   // clamp so a hidden tab can't cause a jump
       waterLastT = now;
       const irr = WATER_IRREGULARITY, tw_ = now * WATER_WAVE_SPEED;                   // tw_ = slow "weather" time for the noise
       const sw = WATER_SWELL.length, amp = new Float64Array(sw);
       for (let i = 0; i < sw; i++) {
           const w = WATER_SWELL[i];
           const speedMod = 1 + irr * 0.65 * (noise3(tw_ * 0.020 + i * 3.7, i * 1.9, 0.3) - 0.5) * 2;   // speed drifts smoothly
           waterPhase[i] += w.k * w.c * Math.max(0.15, speedMod) * dt * WATER_WAVE_SPEED;
           amp[i] = w.a * (1 + irr * 0.75 * (noise3(tw_ * 0.016 + i * 5.1, 2.2 + i, 7.7) - 0.5) * 2);    // size drifts smoothly
       }
       const data = f.img.data, W = tw * N;
       const sizeK = 1 / WATER_RIPPLE_SIZE, warpAmp = 20 * irr;
       const cTone = new Float32Array(CN * CN), cLine = new Float32Array(CN * CN);

       for (let ty = 0; ty < th; ty++) for (let tx = 0; tx < tw; tx++) {
           const gx = f.ox + tx, gy = f.oy + ty;
           if (!(gx >= 0 && gx < MAP_W && gy >= 0 && gy < MAP_H && map[gx][gy] === 2)) continue;
           let rects = null;                                    // nearby land, used to lighten the shallows
           for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
               if ((i || j) && isWaterLand(gx + i, gy + j)) (rects || (rects = [])).push((gx + i) * T, (gy + j) * T);
           }

           for (let j = 0; j < CN; j++) for (let i = 0; i < CN; i++) {
               const wx = gx * T + i * C, wy = gy * T + j * C;
               // smooth, slowly changing warp so no ripple is a perfect straight line or circle
               const px = wx + warpAmp * (noise3(wx / 140, wy / 140, tw_ * 0.045) - 0.5) * 2;
               const py = wy + warpAmp * (noise3(wx / 140 + 31.7, wy / 140 + 17.3, tw_ * 0.045 + 5.5) - 0.5) * 2;
               // patches where the water is livelier or calmer (occasional stronger ripples)
               const env = noise3(wx / 240 + 3.1, wy / 240 - 7.3, tw_ * 0.028);
               const lively = 0.55 + 1.3 * env * env;

                   let lv = Math.floor(tone * (WATER_LEVELS - 1) + bayer * 0.9 + 0.05);

   function drawWaterTile(x, y, sx, sy) {
       const f = waterField;
       if (!f.ready) { fillTile(sx, sy, '#0f6a92'); return; }
       snapDraw(f.canvas, (x - f.ox) * WATER_TS, (y - f.oy) * WATER_TS, WATER_TS, WATER_TS, sx, sy, TILE_SIZE, TILE_SIZE);   // crisp pixel blocks
   }

   // ---- shoreline foam ----
   const FOAM_K1 = 2 * Math.PI / 82, PEAK = 0.28;       // PEAK = where in each wave cycle the water hits land
   // Wave phase at world position s along a shore. The noise terms make timing uneven along the
   // shore and over time, but stay smooth, so neighbouring tiles join up and nothing jitters.
   function foamPhase(s, tSec, side) {
       const q = tSec * FOAM_SPEED;
       return FOAM_K1 * s + 0.58 * q
           + 2.6 * (noise3(s / 43 + side * 17.3, 3.7 + side, q * 0.045) - 0.5) * 2
           + 1.2 * (noise3(s / 15 + 9.1 + side * 5.1, 1.3, q * 0.085) - 0.5) * 2;
   }
   // 0..1. Quick rise to the impact, then a slow fade while the water retreats.
   function foamSurge(theta) {

   // Foam shape at world position s along a shore: inner/outer edge of the white line (px from the boundary)
   const foamOut = { inner: 0, outer: 0, S: 0, glow: 1 };
   function foamAt(s, side, tSec) {
       const q = tSec * FOAM_SPEED, S = foamSurge(foamPhase(s, tSec, side));
       const reach = 0.35 + 0.95 * noise3(s / 37 + side * 11.9, 6.1, q * 0.05);           // some stretches reach further than others
       const thick = FOAM_THICKNESS * (0.72 + 0.56 * noise3(s / 29 + side * 7.7, 5.5, q * 0.06)) * (0.88 + 0.28 * S);
       const jitter = 0.7 * (noise3(s / 7 + side * 3.3, 8.8, q * 0.14) - 0.5);            // slightly ragged edge
       const travel = Math.max(0, FOAM_AMPLITUDE * S * reach + jitter);                   // how far the outer edge of the foam pushes out
       foamOut.inner = 0; foamOut.outer = travel + thick; foamOut.S = S;                  // inner edge stays ON the land boundary
       foamOut.glow = 0.78 + 0.3 * noise3(s / 21 + side * 2.7, 4.4, q * 0.1);
       return foamOut;
   }

   // Translucent pixel rectangle with its edges snapped to whole screen pixels: neighbouring rectangles
   // touch exactly (no overlap = no doubled alpha, no gaps = no seam lines).
   function foamRect(x, y, w, h, color) {
       const x0 = Math.round(x * ZOOM) / ZOOM, y0 = Math.round(y * ZOOM) / ZOOM;
       const x1 = Math.round((x + w) * ZOOM) / ZOOM, y1 = Math.round((y + h) * ZOOM) / ZOOM;
       ctx.fillStyle = color; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
   }
   function foamQ(v, steps) { return Math.round(Math.min(1, Math.max(0, v)) * steps) / steps; }   // snap an alpha to a few steps
   const FOAM_WASH = 'rgba(130,228,242,', FOAM_WHITE = 'rgba(236,252,255,';

   // One edge of a water tile that touches land. O = start point on the boundary, a = direction along
   // the shore, n = direction into the water, s0 = world coordinate along the shore at O.
   // Drawn as 2px-wide pixel columns whose depth moves in whole pixels (blocky, like the rest of the art).
   function drawFoamEdge(Ox, Oy, ax, ay, nx, ny, s0, side, tSec) {
       const col = (l, d0, d1) => {                       // rectangle: along the shore l..l+2, depth d0..d1 into the water
           const xA = Ox + ax * l + nx * d0, yA = Oy + ay * l + ny * d0, xB = Ox + ax * (l + 2) + nx * d1, yB = Oy + ay * (l + 2) + ny * d1;
           return [Math.min(xA, xB), Math.min(yA, yB), Math.abs(xB - xA), Math.abs(yB - yA)];
       };
       for (let l = 0; l < 32; l += 2) {
           const o = foamAt(s0 + l + 1, side, tSec);
           const inner = Math.round(o.inner), outer = Math.max(inner + 3, Math.round(o.outer));
           const wash = foamQ((0.12 + 0.20 * o.S) * o.glow, 10), line = foamQ(0.86 + 0.14 * o.S, 20);   // foam is (almost) solid white
           let r = col(l, 0, outer + 2); foamRect(r[0], r[1], r[2], r[3], FOAM_WASH + wash + ')');       // soft cyan wash
           r = col(l, inner, outer); foamRect(r[0], r[1], r[2], r[3], FOAM_WHITE + line + ')');          // thick white line
       }
       // tiny bubbles: born when the water hits, drift out and fade as it retreats
       if (FOAM_BUBBLES) {
           for (let j = Math.floor(s0 / 9); j <= Math.floor((s0 + 31) / 9); j++) {
               if (foamHash(j, side + 11) > 0.62) continue;
               const sb = j * 9 + foamHash(j, side) * 9;
               if (sb < s0 || sb >= s0 + 32) continue;
               let u = foamPhase(sb, tSec, side) / (2 * Math.PI); u -= Math.floor(u);
               const v = (u - PEAK) / 0.5;
               if (v < 0 || v > 1) continue;
               const o = foamAt(sb, side, tSec), alpha = foamQ(Math.pow(1 - v, 1.5) * 0.9, 4);
               if (alpha <= 0) continue;
               const off = o.outer + 1 + 6.5 * v, l = sb - s0, size = foamHash(j, side + 5) > 0.5 ? 2 : 1;
               const bx = Math.round(Ox + ax * l + nx * off), by = Math.round(Oy + ay * l + ny * off);
               foamRect(bx, by, size, size, FOAM_WHITE + alpha + ')');
           }
       }
   }

   // Foam round the outside corner of a land tile that only touches this water tile diagonally.
   // It uses the same shape as the two neighbouring edges, so the line carries on round the corner.
   function drawFoamCorner(cx, cy, qx, qy, sideH, sH, sideV, sV, tSec) {
       const h = foamAt(sH, sideH, tSec), v = foamAt(sV, sideV, tSec);
       const inner = (h.inner + v.inner) / 2, outer = Math.max(inner + 3, (h.outer + v.outer) / 2);
       const S = (h.S + v.S) / 2, gl = (h.glow + v.glow) / 2;
       const wash = foamQ((0.12 + 0.20 * S) * gl, 10), line = foamQ(0.86 + 0.14 * S, 20);
       const cells = Math.ceil((outer + 2.5) / 2);
       for (let j = 0; j < cells; j++) for (let i = 0; i < cells; i++) {
           const d = Math.hypot(i * 2 + 1, j * 2 + 1);                         // distance from the land corner to this 2px cell

   // Rounds a CONVEX water corner (water tile with land on two sides, e.g. land above AND to the left).
   // The corner of the water is cut along a quarter circle of radius FOAM_ROUNDING: the cut-off corner
   // becomes ground again (same ground texture as the rest of the floor) and a thin white foam ring
   // follows the curve, so the lake outline reads as a soft round corner instead of a sharp square one.
   // sx,sy = screen origin of the water tile; qx,qy = which corner (+1/-1 towards the inside of the tile).
   function roundWaterCorner(x, y, sx, sy, qx, qy) {
       const R = FOAM_ROUNDING;
       if (R <= 0) return;
       const art = wallArt(x, y);
       const T = TILE_SIZE, n = Math.ceil(R / 2) + 1;
       for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
           const lx = qx > 0 ? i * 2 : T - (i + 1) * 2, ly = qy > 0 ? j * 2 : T - (j + 1) * 2;   // 2px cell, tile-local
           const dx = i * 2 + 1, dy = j * 2 + 1;                                                 // cell centre measured from the corner
           const d = Math.hypot(dx - R, dy - R);                                                 // distance from the rounding circle's centre
           if (d <= R - 2.5) continue;                                                           // inside the curve: stays water
           const x0 = Math.round((sx + lx) * ZOOM) / ZOOM, y0 = Math.round((sy + ly) * ZOOM) / ZOOM;
           const x1 = Math.round((sx + lx + 2) * ZOOM) / ZOOM, y1 = Math.round((sy + ly + 2) * ZOOM) / ZOOM;
           if (d <= R) {                                                                         // the curve itself: white foam ring
               ctx.fillStyle = 'rgba(236,252,255,0.92)'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
           } else if (art.groundReady) {                                                         // outside the curve: back to ground
               ctx.drawImage(art.ground, lx % 16, ly % 16, 2, 2, x0, y0, x1 - x0, y1 - y0);
           } else {
               ctx.fillStyle = '#d29a7c'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
           }

           const U = isWaterLand(x, y - 1), D = isWaterLand(x, y + 1), L = isWaterLand(x - 1, y), R = isWaterLand(x + 1, y);
           const UL = isWaterLand(x - 1, y - 1), UR = isWaterLand(x + 1, y - 1), DL = isWaterLand(x - 1, y + 1), DR = isWaterLand(x + 1, y + 1);
           if (!(U || D || L || R || UL || UR || DL || DR)) continue;
           const sx = Math.floor(x * T - camera.x), sy = Math.floor(y * T - camera.y), X0 = x * T, Y0 = y * T;
           if (U) drawFoamEdge(sx, sy, 1, 0, 0, 1, X0, 0, tSec);
           if (D) drawFoamEdge(sx, sy + T, 1, 0, 0, -1, X0, 1, tSec);
           if (L) drawFoamEdge(sx, sy, 0, 1, 1, 0, Y0, 2, tSec);
           if (R) drawFoamEdge(sx + T, sy, 0, 1, -1, 0, Y0, 3, tSec);
           if (U && L) roundWaterCorner(x, y, sx, sy, 1, 1);
           if (U && R) roundWaterCorner(x, y, sx, sy, -1, 1);
           if (D && L) roundWaterCorner(x, y, sx, sy, 1, -1);
           if (D && R) roundWaterCorner(x, y, sx, sy, -1, -1);
           if (UL && !U && !L) drawFoamCorner(sx, sy, 1, 1, 0, X0, 2, Y0, tSec);
           if (UR && !U && !R) drawFoamCorner(sx + T, sy, -1, 1, 0, X0 + T, 3, Y0, tSec);
           if (DL && !D && !L) drawFoamCorner(sx, sy + T, 1, -1, 1, X0, 2, Y0 + T, tSec);
           if (DR && !D && !R) drawFoamCorner(sx + T, sy + T, -1, -1, 1, X0 + T, 3, Y0 + T, tSec);

   // --- INVENTORY UI SETUP ---
   const mcScreen = document.getElementById('mc-screen');
   const mcWindow = document.getElementById('mc-window');
   const hotbarDiv = document.getElementById('mc-hotbar');
   const dragGhostEl = document.getElementById('drag-ghost');


   // Build static hotbar
   for(let i = 0; i < 9; i++) {
       let slot = createSlot('inv-' + i);
       hotbarDiv.appendChild(slot);
   }


   function createSlot(id) {
       let slot = document.createElement('div');
       slot.className = 'mc-slot';
       slot.dataset.id = id;
       slot.addEventListener('mousedown', handleSlotClick);
       return slot;
   }


   function openUI(type) {
       activeUI = type;
       mcWindow.innerHTML = '';
       
       let topRow = document.createElement('div');
       topRow.className = 'mc-row';


       if (type === 'inventory') {
           // Left: Armor
           let armorCol = document.createElement('div');
           armorCol.className = 'mc-col';
           for(let i=0; i<4; i++) armorCol.appendChild(createSlot('armor-' + i));
           
           let spacer1 = document.createElement('div');
           spacer1.className = 'mc-spacer';


           // Middle: 2x2 Craft
           let craft2Grid = document.createElement('div');
           craft2Grid.className = 'mc-grid-2x2';
           for(let i=0; i<4; i++) craft2Grid.appendChild(createSlot('craft2-' + i));


           let spacer2 = document.createElement('div');
           spacer2.className = 'mc-spacer';


           // Right: Output
           let outCol = document.createElement('div');
           outCol.className = 'mc-col';
           let outSlot = createSlot('out2-0');
           outSlot.classList.add('out-slot');
           outCol.appendChild(outSlot);


           topRow.appendChild(armorCol);
           topRow.appendChild(spacer1);
           topRow.appendChild(craft2Grid);
           topRow.appendChild(spacer2);
           topRow.appendChild(outCol);
       } else if (type === 'crafting') {
           // Left: 3x3 Craft
           let craft3Grid = document.createElement('div');
           craft3Grid.className = 'mc-grid-3x3';
           for(let i=0; i<9; i++) craft3Grid.appendChild(createSlot('craft3-' + i));


           let spacer = document.createElement('div');
           spacer.className = 'mc-spacer';


           // Right: Output
           let outCol = document.createElement('div');
           outCol.className = 'mc-col';
           let outSlot = createSlot('out3-0');
           outSlot.classList.add('out-slot');
           outCol.appendChild(outSlot);


           topRow.appendChild(craft3Grid);
           topRow.appendChild(spacer);
           topRow.appendChild(outCol);
       }


       mcWindow.appendChild(topRow);


       // Main Inventory
       let mainInv = document.createElement('div');
       mainInv.className = 'mc-main-inv';
       for(let i=9; i<36; i++) mainInv.appendChild(createSlot('inv-' + i));
       mcWindow.appendChild(mainInv);


       // Hotbar inside window
       let hbRow = document.createElement('div');
       hbRow.className = 'mc-row';
       let hbSpacer = document.createElement('div');
       hbSpacer.style.height = '10px';
       hbRow.appendChild(hbSpacer);
       mcWindow.appendChild(hbRow);


       let hbGrid = document.createElement('div');
       hbGrid.className = 'mc-row';
       for(let i=0; i<9; i++) hbGrid.appendChild(createSlot('inv-' + i));
       mcWindow.appendChild(hbGrid);


       mcScreen.classList.add('open');
       updateAllVisuals();
   }


   function closeUI() {
       activeUI = 'none';
       mcScreen.classList.remove('open');
       // Drop dragging item back into world if UI closed while still holding one
       if (draggingItem) {
           dropDraggingItemToWorld({ clientX: 0, clientY: 0 });
           dragGhostEl.style.display = 'none';
       }
   }


   function getSlotData(id) {
       if (id.startsWith('inv-')) return inventory[parseInt(id.slice(4))];
       if (id.startsWith('armor-')) return armor[parseInt(id.slice(6))];
       if (id.startsWith('craft2-')) return craft2[parseInt(id.slice(7))];
       if (id.startsWith('craft3-')) return craft3[parseInt(id.slice(7))];
       if (id === 'out2-0') return out2;
       if (id === 'out3-0') return out3;
       return null;
   }


   function setSlotData(id, val) {
       if (id.startsWith('inv-')) inventory[parseInt(id.slice(4))] = val;
       else if (id.startsWith('armor-')) armor[parseInt(id.slice(6))] = val;
       else if (id.startsWith('craft2-')) craft2[parseInt(id.slice(7))] = val;
       else if (id.startsWith('craft3-')) craft3[parseInt(id.slice(7))] = val;
       else if (id === 'out2-0') out2 = val;
       else if (id === 'out3-0') out3 = val;
   }


   function getOreColor(type) {
       if (type === 3) return '#3b82f6'; 
       if (type === 4) return '#22c55e'; 
       if (type === 5) return '#ef4444'; 
       if (type === 6) return '#a855f7'; 
       if (type === 7) return '#8B4513';
       if (type === 8) return '#1a1a1a';  // coal - black
       if (type === 9) return '#d1d5db';  // iron - grey-white
       if (type === 10) return '#fbbf24'; 
       if (type === 11) return '#94a3b8'; 
       if (type === 12) return '#475569'; 
       if (type === 13) return '#16a34a';
       if (type === 14) return '#64748b'; // leggings
       if (type === 15) return '#334155'; // boots
       if (type === 16) return '#9ca3af'; // pickaxe
       if (type === 17) return '#cbd5e1'; // sword
       if (type === 18) return '#f59e0b'; // torch
       if (type === 19) return '#57534e'; // furnace
       if (type === 20) return '#8b5a2b'; // wood
       if (type === 21) return '#6b4a24'; // dirt block (placeable)
       if (type === 22) return '#f59e0b'; // placed torch
       if (type === 23) return '#a16207'; // shovel
       if (type === 24) return '#7a7a7a'; // stone block (placeable)
       if (type === 25) return '#7a7a7a'; // placed stone wall
       if (type === 31) return '#7a7a7a'; // stone floor (placed stone on void/water)
       if (type === 32) return '#6b4a24'; // dirt floor (placed dirt on void/water)
       if (type === 33) return '#d4a64a'; // meadow floor
       if (type === 34) return '#b8941e'; // meadow wall (darker yellow)
       if (type === 35) return '#e8d44a'; // meadow block (placeable)
       if (type === 36) return '#ffffff'; // light ray (meadow)
       if (type === 37) return '#e8d44a'; // sand block (placeable)
       if (type === 38) return '#c9a94e'; // sand wall
       if (type === 39) return '#e8d44a'; // sand floor
       return '#fff';
   }


   function updateAllVisuals() {
       // Update hotbar (always visible)
       for(let i=0; i<9; i++) {
           let slot = hotbarDiv.children[i];
           slot.innerHTML = '';
           slot.classList.remove('selected');
           if (i === selectedSlot) slot.classList.add('selected');
           if (inventory[i]) renderItemInSlot(slot, inventory[i]);
       }


       // Update active window
       if (activeUI !== 'none') {
           let slots = mcWindow.querySelectorAll('.mc-slot');
           slots.forEach(slot => {
               let id = slot.dataset.id;
               if (!id.startsWith('inv-')) { // Don't double process inv, but DO process hotbar copies inside window
                   slot.innerHTML = '';
                   let data = getSlotData(id);
                   if (data) renderItemInSlot(slot, data);
               } else {
                   // For the hotbar inside the window, just clone logic
                   slot.innerHTML = '';
                   let idx = parseInt(id.slice(4));
                   if (idx === selectedSlot) slot.classList.add('selected');
                   if (inventory[idx]) renderItemInSlot(slot, inventory[idx]);
               }
           });
       }
   }


   function renderItemInSlot(slot, item) {
       let itemDiv = document.createElement('div');
       itemDiv.className = 'mc-item';
       itemDiv.style.background = getOreColor(item.type);
       slot.appendChild(itemDiv);
       
       if (item.count > 1) {
           let countDiv = document.createElement('div');
           countDiv.className = 'mc-count';
           countDiv.innerText = item.count;
           slot.appendChild(countDiv);
       }
   }


   function handleSlotClick(e) {
       e.preventDefault();
       e.stopPropagation();
       let id = e.currentTarget.dataset.id;
       let isRightClick = e.button === 2;
       let isOutput = id.startsWith('out');
       
       let slotItem = getSlotData(id);


       // Pick up output
       if (isOutput && slotItem && !draggingItem) {
           draggingItem = { type: slotItem.type, count: slotItem.count };
           // Consume grid
           if (id === 'out2-0') {
               for(let i=0; i<4; i++) craft2[i] = null;
               checkCrafting();
           } else if (id === 'out3-0') {
               for(let i=0; i<9; i++) craft3[i] = null;
               checkCrafting();
           }
           updateDragGhost(e);
           updateAllVisuals();
           return;
       }


       // Splitting / Right-click placing
       if (isRightClick) {
           if (draggingItem) {
               // Place 1
               if (!slotItem) {
                   setSlotData(id, { type: draggingItem.type, count: 1 });
                   draggingItem.count--;
                   if (draggingItem.count <= 0) draggingItem = null;
               } else if (slotItem.type === draggingItem.type && slotItem.count < 64) {
                   slotItem.count++;
                   draggingItem.count--;
                   if (draggingItem.count <= 0) draggingItem = null;
               }
           } else if (slotItem && slotItem.count > 1) {
               // Pick up half
               let half = Math.ceil(slotItem.count / 2);
               draggingItem = { type: slotItem.type, count: half };
               slotItem.count -= half;
               if (slotItem.count <= 0) setSlotData(id, null);
           }
       } else {
           // Left click: Swap or merge
           if (draggingItem) {
               if (!slotItem) {
                   setSlotData(id, draggingItem);
                   draggingItem = null;
               } else if (slotItem.type === draggingItem.type) {
                   let total = slotItem.count + draggingItem.count;
                   if (total <= 64) {
                       slotItem.count = total;
                       draggingItem = null;
                   } else {
                       slotItem.count = 64;
                       draggingItem.count = total - 64;
                   }
               } else {
                   // Swap
                   setSlotData(id, draggingItem);
                   draggingItem = slotItem;
               }
           } else {
               if (slotItem) {
                   draggingItem = slotItem;
                   setSlotData(id, null);
               }
           }
       }
       
       updateDragGhost(e);
       checkCrafting();
       updateAllVisuals();
   }


   function updateDragGhost(e) {
       if (draggingItem) {
           dragGhostEl.style.display = 'flex';
           dragGhostEl.style.left = (e.clientX - 12) + 'px';
           dragGhostEl.style.top = (e.clientY - 12) + 'px';
           dragGhostEl.innerHTML = '';
           let itemDiv = document.createElement('div');
           itemDiv.className = 'mc-item';
           itemDiv.style.background = getOreColor(draggingItem.type);
           dragGhostEl.appendChild(itemDiv);
           if (draggingItem.count > 1) {
               let countDiv = document.createElement('div');
               countDiv.className = 'mc-count';
               countDiv.innerText = draggingItem.count;
               dragGhostEl.appendChild(countDiv);
           }
       } else {
           dragGhostEl.style.display = 'none';
       }
   }


   window.addEventListener('mousemove', (e) => { if (draggingItem) updateDragGhost(e); });


   function dropDraggingItemToWorld(e) {
       let pwx = camera.x + (canvas.width / 2) / ZOOM;
       let pwy = camera.y + (canvas.height / 2) / ZOOM;
       droppedItems.push({ x: pwx, y: pwy, vx: 0, vy: 0, type: draggingItem.type, life: 1, count: draggingItem.count });
       draggingItem = null;
       updateDragGhost(e);
       updateAllVisuals();
   }


   // Minecraft-style: only drop the held item into the world when you click
   // OUTSIDE the inventory panel (on the dark backdrop or the game itself),
   // not on every mouse release - a normal click already fires mousedown then
   // mouseup, so a release-based listener would instantly un-pick-up anything
   // you just grabbed.
   mcScreen.addEventListener('mousedown', (e) => {
       if (e.target === mcScreen && draggingItem) dropDraggingItemToWorld(e);
   });


   window.addEventListener('wheel', (e) => {
       if (activeUI !== 'none') return; 
       if (e.deltaY > 0) selectedSlot = (selectedSlot + 1) % 9;
       else selectedSlot = (selectedSlot - 1 + 9) % 9;
       updateAllVisuals();
   });


   function checkCrafting() {
       let match2 = null, match3 = null;
       for(let r of recipes) {
           if (r.size === 2 && !match2) {
               let valid = true;
               for(let i=0; i<4; i++) {
                   let gType = craft2[i] ? craft2[i].type : 0;
                   if (gType !== r.pattern[i]) { valid = false; break; }
               }
               if (valid) match2 = r.result;
           } else if (r.size === 3 && !match3) {
               let valid = true;
               for(let i=0; i<9; i++) {
                   let gType = craft3[i] ? craft3[i].type : 0;
                   if (gType !== r.pattern[i]) { valid = false; break; }
               }
               if (valid) match3 = r.result;
           }
       }
       out2 = match2 ? { type: match2, count: 1 } : null;
       out3 = match3 ? { type: match3, count: 1 } : null;
   }


   function addItemToInventory(type) {
       // Try stack first
       for(let i = 0; i < 36; i++) {
           if (inventory[i] && inventory[i].type === type && inventory[i].count < 64) {
               inventory[i].count++;
               updateAllVisuals();
               return true;
           }
       }
       // Find empty
       for(let i = 0; i < 36; i++) {
           if (!inventory[i]) {
               inventory[i] = { type: type, count: 1 };
               updateAllVisuals();
               return true;
           }
       }
       return false; 
   }


   function spawnDroppedItem(tx, ty, type) {
       // Pop-out item: bursts out of the broken block with upward + sideways velocity, then falls and
       // bounces. The droppedItems update logic handles the rest (gravity, friction, pickup).
       const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.4;   // mostly upward, random sideways spread
       const spd = 3.5 + Math.random() * 2.5;                    // pop speed
       droppedItems.push({
           x: tx * TILE_SIZE + TILE_SIZE / 2,
           y: ty * TILE_SIZE + TILE_SIZE / 2,
           vx: Math.cos(ang) * spd,
           vy: Math.sin(ang) * spd - 1.5,                        // extra upward kick
           type: type,
           count: 1,
           life: 0,
           pop: 1,                                               // pop animation timer (1 -> 0)
           bounce: 0                                             // bounce counter
       });
   }


   // --- CAVE GENERATION ---
   function initMap() {
       for (let x = 0; x < MAP_W; x++) {
           map[x] = [];
           for (let y = 0; y < MAP_H; y++) {
               if (x === 0 || x === MAP_W - 1 || y === 0 || y === MAP_H - 1) {
                   map[x][y] = 0;
               } else if (Math.random() < INITIAL_WALL_PERCENT) {
                   // This tile is a wall - roll for a single-tile ore vein.
                   // 8 = Coal (black), 9 = Iron (grey-white)
                   let oreRoll = Math.random();
                   if (oreRoll < IRON_SPAWN_CHANCE) map[x][y] = 9;
                   else if (oreRoll < IRON_SPAWN_CHANCE + COAL_SPAWN_CHANCE) map[x][y] = 8;
                   else map[x][y] = 0;                      // plain wall
               } else {
                   map[x][y] = 1;
               }
           }
       }
   }


   function countHoleNeighbors(x, y) {
       let count = 0;
       for (let i = -1; i <= 1; i++) { for (let j = -1; j <= 1; j++) { if (i === 0 && j === 0) continue; let nx = x + i; let ny = y + j; if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) continue; if (map[nx][ny] === 1 || map[nx][ny] === 2) count++; } }
       return count;
   }


   function runCellularAutomata() {
       for (let i = 0; i < CA_SIMULATION_STEPS; i++) {
           let newMap = [];
           for (let x = 0; x < MAP_W; x++) { newMap[x] = []; for (let y = 0; y < MAP_H; y++) { let holeNeighbors = countHoleNeighbors(x, y); if (map[x][y] === 1 || map[x][y] === 2) { if (holeNeighbors < HOLE_SURVIVE_MIN_NEIGHBORS) newMap[x][y] = 0; else newMap[x][y] = map[x][y]; } else { if (holeNeighbors >= WALL_ERODE_MIN_NEIGHBORS) newMap[x][y] = 1; else newMap[x][y] = map[x][y]; /* preserve plain/coal/iron wall type */ } } }
           map = newMap;
       }
   }


   function bresenhamLine(x0, y0, x1, y1) {
       let points = [];
       let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
       let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
       let err = dx - dy;
       let x = x0, y = y0;
       while (true) {
           points.push({x, y});
           if (x === x1 && y === y1) break;
           let e2 = 2 * err;
           if (e2 > -dy) { err -= dy; x += sx; }
           if (e2 < dx) { err += dx; y += sy; }
       }
       return points;
   }


   function connectNearbyWhiteTiles() {
       let whiteTiles = [];
       for (let x = 0; x < MAP_W; x++) { for (let y = 0; y < MAP_H; y++) { if (map[x][y] === 1) whiteTiles.push({x, y}); } }
       if (whiteTiles.length < 2) return;
       let iterations = Math.round((MAP_W * MAP_H) / WALL_CONNECT_DIVISOR);
       for (let i = 0; i < iterations; i++) {
           if (whiteTiles.length < 2) break;
           let t1 = whiteTiles[Math.floor(Math.random() * whiteTiles.length)];
           let candidates = [];
           for (let dx = -WALL_CONNECT_MAX_DIST; dx <= WALL_CONNECT_MAX_DIST; dx++) {
               for (let dy = -WALL_CONNECT_MAX_DIST; dy <= WALL_CONNECT_MAX_DIST; dy++) {
                   if (dx === 0 && dy === 0) continue;
                   if (Math.hypot(dx, dy) > WALL_CONNECT_MAX_DIST) continue;
                   let nx = t1.x + dx, ny = t1.y + dy;
                   if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) continue;
                   if (map[nx][ny] !== 1) continue;
                   let line = bresenhamLine(t1.x, t1.y, nx, ny);
                   let hasWallBetween = line.some(p => map[p.x][p.y] === 0);
                   if (hasWallBetween) candidates.push({x: nx, y: ny, line});
               }
           }
           if (candidates.length === 0) continue;
           let chosen = candidates[Math.floor(Math.random() * candidates.length)];
           chosen.line.forEach(p => {
               if (map[p.x][p.y] === 0) {
                   map[p.x][p.y] = 1;
                   whiteTiles.push({x: p.x, y: p.y});
               }
           });
       }
   }


   function carveSpawnRoom() {
       let cx = Math.floor(MAP_W / 2); let cy = Math.floor(MAP_H / 2);
       for (let x = cx - SPAWN_ROOM_RADIUS; x <= cx + SPAWN_ROOM_RADIUS; x++) { for (let y = cy - SPAWN_ROOM_RADIUS; y <= cy + SPAWN_ROOM_RADIUS; y++) { if (x >= 0 && x < MAP_W && y >= 0 && y < MAP_H) map[x][y] = 1; } }
       
       let tableX = cx - 4; let tableY = cy;
       if (tableX >= 0 && tableX < MAP_W && tableY >= 0 && tableY < MAP_H) {
           map[tableX][tableY] = 7;
           craftingTablePos = { x: tableX, y: tableY };
       }


       camera.x = (cx * TILE_SIZE) - (canvas.width / ZOOM / 2) + (TILE_SIZE / 2);
       camera.y = (cy * TILE_SIZE) - (canvas.height / ZOOM / 2) + (TILE_SIZE / 2);
   }

   // If the player spawns on water (spawn tile became water after lake generation), find the
   // nearest floor tile and teleport the camera there. Called once after all generation is done.
   // If the player spawns on a non-floor tile (water, void, wall, etc.), find the nearest floor
   // tile (1 or 31) and teleport the camera there. Called once after all generation is done.
   function teleportFromWaterIfNeeded() {
       const cx = Math.floor(MAP_W / 2), cy = Math.floor(MAP_H / 2);
       if (map[cx][cy] === 1 || map[cx][cy] === 31) return;   // already on floor, nothing to do
       // spiral outward from spawn to find the nearest floor tile
       for (let r = 1; r < 200; r++) {
           for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
               if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;   // only check the ring at radius r
               const x = cx + dx, y = cy + dy;
               if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) continue;
               if (map[x][y] === 1 || map[x][y] === 31 || map[x][y] === 32 || map[x][y] === 33) {
                   camera.x = (x * TILE_SIZE) - (canvas.width / ZOOM / 2) + (TILE_SIZE / 2);
                   camera.y = (y * TILE_SIZE) - (canvas.height / ZOOM / 2) + (TILE_SIZE / 2);
                   return;
               }
           }
       }
   }

   // If the player's CENTER is inside a non-walkable tile (wall, void, water), teleport them to the
   // center of the nearest floor tile. Called every frame in update() and after placing blocks.
   // Only triggers when the player is genuinely stuck IN a block, not just touching its edge.
   function teleportFromVoidIfNeeded() {
       const pwx = camera.x + (canvas.width / 2) / ZOOM;
       const pwy = camera.y + (canvas.height / 2) / ZOOM;
       const ptx = Math.floor(pwx / TILE_SIZE), pty = Math.floor(pwy / TILE_SIZE);
       if (ptx < 0 || ptx >= MAP_W || pty < 0 || pty >= MAP_H) return;
       const v = map[ptx][pty];
       // only teleport if the player's center is in a wall, void, or water (not floor/stone floor/torch/table)
       if (v === 1 || v === 7 || v === 31 || v === 32 || v === 33 || v === 39 || v === 22) return;   // walkable tiles (incl. torch, meadow, sand) — no teleport
       // spiral outward to find the nearest floor tile (1 or 31)
       for (let r = 1; r < 50; r++) {
           for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
               if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
               const x = ptx + dx, y = pty + dy;
               if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) continue;
               if (map[x][y] === 1 || map[x][y] === 31 || map[x][y] === 32 || map[x][y] === 33) {
                   camera.x = (x * TILE_SIZE) - (canvas.width / ZOOM / 2) + (TILE_SIZE / 2);
                   camera.y = (y * TILE_SIZE) - (canvas.height / ZOOM / 2) + (TILE_SIZE / 2);
                   return;
               }
           }
       }
   }


   // ==========================================
   // 🌊 LAKE SHAPES (built from overlapping circles, then turned into tiles)
   // ==========================================
   // Small lakes are common, big lakes less common, snaking lakes are rare.
   function pickLakeType() {
       const r = Math.random();
       if (r < LAKE_SNAKING_CHANCE) return 'snaking';
       if (r < LAKE_SNAKING_CHANCE + LAKE_BIG_CHANCE) return 'big';
       return 'small';
   }

   function rand(min, max) { return min + Math.random() * (max - min); }

   // Adds an (optionally oval) blob to a grid: centre cx,cy, radii rx,ry, rotation ang.
   function stampBlob(grid, cx, cy, rx, ry, ang) {
       const size = grid.length, cos = Math.cos(ang), sin = Math.sin(ang);
       const reach = Math.ceil(Math.max(rx, ry)) + 1;
       for (let x = Math.max(0, Math.floor(cx - reach)); x <= Math.min(size - 1, Math.ceil(cx + reach)); x++) {
           for (let y = Math.max(0, Math.floor(cy - reach)); y <= Math.min(size - 1, Math.ceil(cy + reach)); y++) {
               const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
               const u = (dx * cos + dy * sin) / rx, v = (-dx * sin + dy * cos) / ry;
               if (u * u + v * v <= 1) grid[x][y] = 1;
           }
       }
   }

   // Count of the 8 surrounding water cells of a lake grid.
   function lakeNeighbors8(grid, x, y) { return countLocalNeighbors(grid, x, y); }
   function lakeNeighbors4(grid, x, y) {
       const size = grid.length; let c = 0;
       if (x > 0 && grid[x - 1][y] === 1) c++;
       if (x < size - 1 && grid[x + 1][y] === 1) c++;
       if (y > 0 && grid[x][y - 1] === 1) c++;
       if (y < size - 1 && grid[x][y + 1] === 1) c++;
       return c;
   }

   // Flood fill with 4-way connectivity over cells equal to `value`; returns list of cells.
   function lakeFlood4(grid, sx, sy, value, visited) {
       const size = grid.length, out = [], stack = [[sx, sy]];
       visited[sx][sy] = true;
       while (stack.length) {
           const [x, y] = stack.pop(); out.push([x, y]);
           for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
               const nx = x + dx, ny = y + dy;
               if (nx < 0 || ny < 0 || nx >= size || ny >= size) continue;
               if (visited[nx][ny] || grid[nx][ny] !== value) continue;
               visited[nx][ny] = true; stack.push([nx, ny]);
           }
       }
       return out;
   }

   // Smooth the shore, keep ONE connected body of water, fill gaps/holes, trim thin spurs.
   function cleanLakeGrid(grid, smoothShore) {
       const size = grid.length;
       if (smoothShore) {                                    // gentle majority smoothing = smooth shoreline
           const next = emptyLocalGrid(size);
           for (let x = 0; x < size; x++) for (let y = 0; y < size; y++) {
               const n = lakeNeighbors8(grid, x, y);
               next[x][y] = grid[x][y] === 1 ? (n >= 3 ? 1 : 0) : (n >= 5 ? 1 : 0);
           }
           for (let x = 0; x < size; x++) for (let y = 0; y < size; y++) grid[x][y] = next[x][y];
       }
       // keep only the largest connected body (no disconnected water)
       let visited = emptyLocalGrid(size).map(c => c.map(() => false)), best = [];
       for (let x = 0; x < size; x++) for (let y = 0; y < size; y++) {
           if (grid[x][y] === 1 && !visited[x][y]) {
               const body = lakeFlood4(grid, x, y, 1, visited);
               if (body.length > best.length) best = body;
           }
       }
       const clean = emptyLocalGrid(size);
       best.forEach(([x, y]) => clean[x][y] = 1);
       // fill holes: any dry cell that cannot reach the grid border becomes water
       visited = emptyLocalGrid(size).map(c => c.map(() => false));
       for (let i = 0; i < size; i++) {
           for (const [x, y] of [[i, 0], [i, size - 1], [0, i], [size - 1, i]]) {
               if (clean[x][y] === 0 && !visited[x][y]) lakeFlood4(clean, x, y, 0, visited);
           }
       }
       for (let x = 0; x < size; x++) for (let y = 0; y < size; y++) if (clean[x][y] === 0 && !visited[x][y]) clean[x][y] = 1;
       // trim awkward thin spurs (a water cell hanging on by a single neighbour)
       if (smoothShore) {
           for (let pass = 0; pass < 2; pass++) {
               for (let x = 0; x < size; x++) for (let y = 0; y < size; y++) {
                   if (clean[x][y] === 1 && lakeNeighbors4(clean, x, y) <= 1) clean[x][y] = 0;
               }
           }
       }
       return clean;
   }

   function makeBigLake() {
       const size = 44, grid = emptyLocalGrid(size), c = size / 2;
       const mainR = rand(7, 10.5);                                  // one big circle as the main body
       stampBlob(grid, c, c, mainR * rand(0.9, 1.1), mainR * rand(0.8, 1.0), rand(0, Math.PI));
       const extras = 2 + Math.floor(Math.random() * 4);             // 3-6 circles in total
       for (let i = 0; i < extras; i++) {                            // smaller circles = bays and uneven shores
           const a = rand(0, Math.PI * 2), r = rand(3, 6.5);
           const d = mainR * rand(0.55, 1.0);                        // close enough to always overlap the main body
           stampBlob(grid, c + Math.cos(a) * d, c + Math.sin(a) * d, r, r * rand(0.8, 1.1), rand(0, Math.PI));
       }
       return cleanLakeGrid(grid, true);
   }

   function makeSmallLake() {
       const size = 24, grid = emptyLocalGrid(size), c = size / 2;
       const r = rand(3, 5);
       stampBlob(grid, c, c, r * rand(1.0, 1.3), r * rand(0.75, 0.95), rand(0, Math.PI));   // slightly oval
       const extras = 1 + Math.floor(Math.random() * 2);             // 2-3 circles in total
       for (let i = 0; i < extras; i++) {
           const a = rand(0, Math.PI * 2), rr = rand(2, 3.6);
           const d = r * rand(0.6, 0.95);
           stampBlob(grid, c + Math.cos(a) * d, c + Math.sin(a) * d, rr, rr * rand(0.8, 1.1), rand(0, Math.PI));
       }
       const clean = cleanLakeGrid(grid, true);
       // 1-2 subtle shoreline indentations
       const dents = 1 + Math.floor(Math.random() * 2);
       for (let i = 0; i < dents; i++) {
           const a = rand(0, Math.PI * 2), d = r * 1.05;
           const dx = c + Math.cos(a) * d, dy = c + Math.sin(a) * d, dr = rand(1.1, 1.6);
           for (let x = 0; x < size; x++) for (let y = 0; y < size; y++) {
               if (Math.hypot(x + 0.5 - dx, y + 0.5 - dy) <= dr) clean[x][y] = 0;
           }
       }
       return cleanLakeGrid(clean, true);      // trims any thin leftover spurs
   }

   function makeSnakingLake() {
       const size = 72, grid = emptyLocalGrid(size), c = size / 2;
       const length = rand(30, 46), amp = rand(4, 6.5), waves = rand(1.0, 1.6);   // an S-shaped path
       const rot = rand(0, Math.PI * 2), cosR = Math.cos(rot), sinR = Math.sin(rot);
       const phase = rand(0, Math.PI), width = rand(1.1, 1.5);                     // radius 1.1-1.5 = 2-3 tiles wide
       const step = 0.6;                                                            // small steps = circles overlap, no gaps
       const poolAt = Math.random() < 0.6 ? rand(0.2, 0.8) * length : -1;           // sometimes widen into a small pool
       let wobble = 0;
       for (let t = 0; t <= length; t += step) {
           wobble += rand(-0.05, 0.05);                                            // gentle drift, no sharp turns
           const px = t - length / 2;
           const py = amp * Math.sin((t / length) * Math.PI * 2 * waves + phase) + wobble * 3;
           const x = c + px * cosR - py * sinR, y = c + px * sinR + py * cosR;
           let r = width;
           if (poolAt >= 0) {
               const k = Math.abs(t - poolAt);
               if (k < 5) r = Math.max(r, 3.4 * (1 - k / 5) + width * (k / 5));     // pool swells in and out smoothly
           }
           stampBlob(grid, x, y, r, r, 0);
       }
       return cleanLakeGrid(grid, false);
   }

   function makeLakeShape(type) {
       if (type === 'big') return makeBigLake();
       if (type === 'snaking') return makeSnakingLake();
       return makeSmallLake();
   }

   function generateLakes() {
       let numberOfLakes = Math.round((MAP_W * MAP_H) / LAKE_DENSITY_DIVISOR);
       for (let i = 0; i < numberOfLakes; i++) {
           const type = pickLakeType();
           const shapeData = makeLakeShape(type);
           const gridSize = shapeData.length; const half = Math.floor(gridSize / 2);
           if (MAP_W <= gridSize || MAP_H <= gridSize) continue;
           // snaking/small lakes are smaller, so they need a lower touch requirement than big ones
           const minShore = type === 'big' ? LAKE_MIN_SHORELINE : Math.ceil(LAKE_MIN_SHORELINE / 2);
           const minWall = type === 'big' ? LAKE_MIN_WALL_TOUCH : Math.ceil(LAKE_MIN_WALL_TOUCH / 2);
           for (let attempt = 0; attempt < 30; attempt++) {
               let centerX = Math.floor(Math.random() * (MAP_W - gridSize)) + half;
               let centerY = Math.floor(Math.random() * (MAP_H - gridSize)) + half;
               let shoreline = 0; let wallTouch = 0;
               for (let lx = 0; lx < gridSize; lx++) { for (let ly = 0; ly < gridSize; ly++) {
                   if (shapeData[lx][ly] === 1) {
                       let gx = centerX + lx - half; let gy = centerY + ly - half;
                       if (gx >= 0 && gx < MAP_W && gy >= 0 && gy < MAP_H) {
                           if (map[gx][gy] === 1) shoreline++; else if (map[gx][gy] === 0 || map[gx][gy] === 8 || map[gx][gy] === 9) wallTouch++;
                       }
                   }
               }}
               if (shoreline >= minShore && wallTouch >= minWall) {
                   for (let lx = 0; lx < gridSize; lx++) { for (let ly = 0; ly < gridSize; ly++) {
                       if (shapeData[lx][ly] === 1) {
                           let gx = centerX + lx - half; let gy = centerY + ly - half;
                           if (gx >= 0 && gx < MAP_W && gy >= 0 && gy < MAP_H) map[gx][gy] = 2;
                       }
                   }}
                   break;
               }
           }
       }
   }

   function makeOrganicLakeShape(targetSize) {
       let size = LAKE_GRID_SIZE; let grid = emptyLocalGrid(size);
       let cx = size / 2, cy = size / 2; let maxDist = Math.hypot(cx, cy);
       for (let x = 0; x < size; x++) { for (let y = 0; y < size; y++) {
           let dist = Math.hypot(x - cx, y - cy);
           let chance = 0.55 * (1 - dist / maxDist) + 0.05;
           grid[x][y] = (Math.random() < chance) ? 1 : 0;
       }}
       for (let step = 0; step < 4; step++) {
           let newGrid = emptyLocalGrid(size);
           for (let x = 0; x < size; x++) { for (let y = 0; y < size; y++) {
               let neighbors = countLocalNeighbors(grid, x, y);
               if (grid[x][y] === 1) newGrid[x][y] = (neighbors < 3) ? 0 : 1;
               else newGrid[x][y] = (neighbors > 5) ? 1 : 0;
           }}
           grid = newGrid;
       }
       grid = isolateMainBlobAndFill(grid); grid = resizeLocalShape(grid, targetSize);
       return grid;
   }


   function countWaterNeighbors(x, y) {
       let count = 0;
       for (let i = -1; i <= 1; i++) { for (let j = -1; j <= 1; j++) {
           if (i === 0 && j === 0) continue; let nx = x + i, ny = y + j;
           if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) continue;
           if (map[nx][ny] === 2) count++;
       }}
       return count;
   }


   function engulfSurroundedWhiteTiles() {
       let toConvert = [];
       for (let x = 0; x < MAP_W; x++) { for (let y = 0; y < MAP_H; y++) {
           if (map[x][y] === 1 && countWaterNeighbors(x, y) >= WATER_ENGULF_MIN_NEIGHBORS) toConvert.push({x, y});
       }}
       toConvert.forEach(p => map[p.x][p.y] = 2);
   }


   function smoothWaterEdges() {
       for (let step = 0; step < WATER_SMOOTH_STEPS; step++) {
           let changes = [];
           for (let x = 0; x < MAP_W; x++) { for (let y = 0; y < MAP_H; y++) {
               if (map[x][y] === 0 || map[x][y] === 8 || map[x][y] === 9) continue; 
               let waterNeighbors = countWaterNeighbors(x, y);
               if (map[x][y] === 1 && waterNeighbors >= 5) changes.push({x, y, val: 2}); 
               else if (map[x][y] === 2 && waterNeighbors <= 2) changes.push({x, y, val: 1}); 
           }}
           changes.forEach(c => map[c.x][c.y] = c.val);
       }
   }


   // ==========================================
   // 🕳️ VOID FLOOR GENERATION (like water, but it's a hole you can't walk over)
   // ==========================================
   // Generate void patches the same way lakes are generated: pick a shape, find a spot where it
   // touches enough floor, stamp it as void (30). Void blocks movement but lets light through.
   const VOID_DENSITY_DIVISOR = 12000;   // smaller = more void patches
   function generateVoidPatches() {
       let numberOfPatches = Math.round((MAP_W * MAP_H) / VOID_DENSITY_DIVISOR);
       for (let i = 0; i < numberOfPatches; i++) {
           const type = Math.random() < 0.3 ? 'big' : (Math.random() < 0.1 ? 'snaking' : 'small');
           const shapeData = makeLakeShape(type);
           const gridSize = shapeData.length; const half = Math.floor(gridSize / 2);
           if (MAP_W <= gridSize || MAP_H <= gridSize) continue;
           const minShore = type === 'big' ? LAKE_MIN_SHORELINE : Math.ceil(LAKE_MIN_SHORELINE / 2);
           const minWall = type === 'big' ? LAKE_MIN_WALL_TOUCH : Math.ceil(LAKE_MIN_WALL_TOUCH / 2);
           for (let attempt = 0; attempt < 30; attempt++) {
               let centerX = Math.floor(Math.random() * (MAP_W - gridSize)) + half;
               let centerY = Math.floor(Math.random() * (MAP_H - gridSize)) + half;
               let shoreline = 0; let wallTouch = 0;
               for (let lx = 0; lx < gridSize; lx++) { for (let ly = 0; ly < gridSize; ly++) {
                   if (shapeData[lx][ly] === 1) {
                       let gx = centerX + lx - half; let gy = centerY + ly - half;
                       if (gx >= 0 && gx < MAP_W && gy >= 0 && gy < MAP_H) {
                           if (map[gx][gy] === 1) shoreline++; else if (map[gx][gy] === 0 || map[gx][gy] === 8 || map[gx][gy] === 9) wallTouch++;
                       }
                   }
               }}
               if (shoreline >= minShore && wallTouch >= minWall) {
                   for (let lx = 0; lx < gridSize; lx++) { for (let ly = 0; ly < gridSize; ly++) {
                       if (shapeData[lx][ly] === 1) {
                           let gx = centerX + lx - half; let gy = centerY + ly - half;
                           if (gx >= 0 && gx < MAP_W && gy >= 0 && gy < MAP_H && map[gx][gy] === 1) map[gx][gy] = 30;
                       }
                   }}
                   break;
               }
           }
       }
   }

   // ==========================================
   // 🌼 MEADOW BIOME (calm golden grass sub-biome)
   // ==========================================
   // Spawns ONE big circle near the EDGE of the dirt biome (close to stone, maybe protruding into it),
   // then 2-4 additional circles (big or small) whose centers sit ON the circumference of the first
   // big circle. All circles overlap. Diameter of every circle < radius of dirt biome.
   // Converts ALL tiles in its area (floor, walls, everything) to meadow — it's its own biome.
   function generateMeadow() {
       const cx = Math.floor(MAP_W / 2), cy = Math.floor(MAP_H / 2);
       const R = ZONE_RADIUS;   // radius of the dirt biome

       // Pick a random direction, place the big circle near the EDGE of the dirt biome.
       const dir = Math.random() * Math.PI * 2;
       const edgeDist = R * 0.65;   // 65% of the way to the edge — close to stone, may protrude
       const bcx = cx + Math.cos(dir) * edgeDist;
       const bcy = cy + Math.sin(dir) * edgeDist;

       // The big circle: diameter < R, so radius < R/2.
       const bigR = R * (0.18 + Math.random() * 0.07);   // radius 0.18R-0.25R, diameter 0.36R-0.50R < R ✓
       stampMeadowCircle(bcx, bcy, bigR, bigR, 0);

       // 2-4 additional circles, centers on the circumference of the big circle.
       const x = 2 + Math.floor(Math.random() * 3);   // 2-4
       for (let i = 0; i < x; i++) {
           const a = (i / x) * Math.PI * 2 + Math.random() * 0.5;   // spread around the circle
           const px = bcx + Math.cos(a) * bigR;   // center on the big circle's circumference
           const py = bcy + Math.sin(a) * bigR;
           // each extra circle: big or small, diameter < R
           const r = R * (0.08 + Math.random() * 0.10);   // radius 0.08R-0.18R, diameter < R ✓
           stampMeadowCircle(px, py, r, r * (0.85 + Math.random() * 0.2), Math.random() * Math.PI);
       }

       // Helper: stamp an oval of meadow onto the map. Converts ALL tiles (floor, walls, ores, etc)
       // to meadow floor (33) — this is its own biome, it replaces whatever was there.
       // Does NOT convert: water (2), void (30), placed torches (22), crafting table (7).
       function stampMeadowCircle(ccx, ccy, rx, ry, ang) {
           const cos = Math.cos(ang), sin = Math.sin(ang);
           const reach = Math.ceil(Math.max(rx, ry)) + 1;
           for (let x = Math.max(0, Math.floor(ccx - reach)); x <= Math.min(MAP_W - 1, Math.ceil(ccx + reach)); x++) {
               for (let y = Math.max(0, Math.floor(ccy - reach)); y <= Math.min(MAP_H - 1, Math.ceil(ccy + reach)); y++) {
                   const v = map[x][y];
                   // don't convert water, void, torches, crafting table
                   if (v === 2 || v === 30 || v === 22 || v === 7) continue;
                   const dx = x + 0.5 - ccx, dy = y + 0.5 - ccy;
                   const u = (dx * cos + dy * sin) / rx, v2 = (-dx * sin + dy * cos) / ry;
                   if (u * u + v2 * v2 <= 1) map[x][y] = 33;   // meadow floor
               }
           }
       }

       // Generate meadow walls: run a light cellular automata pass inside the meadow area.
       // Wall density is ~45% (less dense than dirt's 70%), creating open, calm meadow spaces.
       // First, randomly assign meadow floor tiles to "wall" or "floor" seeds, then smooth.
       const meadowTiles = [];
       for (let x = 0; x < MAP_W; x++) for (let y = 0; y < MAP_H; y++) {
           if (map[x][y] === 33) {
               // 33% chance to be a wall seed — CA smoothing will reduce to ~20% final
               if (Math.random() < 0.33) map[x][y] = 34;  // meadow wall
               meadowTiles.push({x, y});
           }
       }
       // Smooth: 3 passes of cellular automata. Only count MEADOW walls (34) as walls —
       // non-meadow tiles (dirt/stone outside) are ignored so edge tiles don't become walls.
       for (let step = 0; step < 3; step++) {
           const changes = [];
           for (const {x, y} of meadowTiles) {
               let wallN = 0;
               for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
                   if (dx === 0 && dy === 0) continue;
                   const nx = x + dx, ny = y + dy;
                   if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) continue;
                   if (map[nx][ny] === 34) wallN++;  // only count meadow walls
               }
               if (map[x][y] === 34) {
                   if (wallN < 3) changes.push({x, y, v: 33});  // wall → floor (isolated wall dies)
               } else {
                   if (wallN >= 5) changes.push({x, y, v: 34});  // floor → wall (surrounded by walls)
               }
           }
           for (const c of changes) map[c.x][c.y] = c.v;
       }

       // (light ray generation removed — biome is bright enough without them)
   }

   // ==========================================
   // 🏜️ SAND BIOME (sandy desert sub-biome in the stone ring)
   // ==========================================
   // Spawns ONE big circle in the stone ring (between ZONE_RADIUS and STONE_RING_RADIUS), then
   // 2-4 additional circles on its circumference. Converts ALL tiles to sand floor (39), then
   // runs CA with 40% wall density to create sand walls (38).
   function generateSand() {
       const cx = Math.floor(MAP_W / 2), cy = Math.floor(MAP_H / 2);
       const R = STONE_RING_RADIUS;

       // Pick a random direction, place the big circle RIGHT AT the dirt zone edge
       const dir = Math.random() * Math.PI * 2;
       const edgeDist = ZONE_RADIUS + 15;   // just outside the dirt zone — easy to find!
       const bcx = cx + Math.cos(dir) * edgeDist;
       const bcy = cy + Math.sin(dir) * edgeDist;
       const bigR = 40;   // 40-tile radius — big and obvious
       stampSandCircle(bcx, bcy, bigR, bigR, 0);

       // 3-5 additional circles on the circumference, also big
       const x = 3 + Math.floor(Math.random() * 3);
       for (let i = 0; i < x; i++) {
           const a = (i / x) * Math.PI * 2 + Math.random() * 0.5;
           const px = bcx + Math.cos(a) * bigR;
           const py = bcy + Math.sin(a) * bigR;
           const r = 15 + Math.random() * 20;   // 15-35 tile radius
           stampSandCircle(px, py, r, r * (0.85 + Math.random() * 0.2), Math.random() * Math.PI);
       }

       // Generate sand walls: 40% seed density, CA smoothing
       const sandTiles = [];
       for (let x2 = 0; x2 < MAP_W; x2++) for (let y2 = 0; y2 < MAP_H; y2++) {
           if (map[x2][y2] === 39) {
               if (Math.random() < 0.40) map[x2][y2] = 38;  // sand wall
               sandTiles.push({x: x2, y: y2});
           }
       }
       for (let step = 0; step < 3; step++) {
           const changes = [];
           for (const {x, y} of sandTiles) {
               let wallN = 0;
               for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
                   if (dx === 0 && dy === 0) continue;
                   const nx = x + dx, ny = y + dy;
                   if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) continue;
                   if (map[nx][ny] === 38) wallN++;
               }
               if (map[x][y] === 38) {
                   if (wallN < 3) changes.push({x, y, v: 39});
               } else {
                   if (wallN >= 5) changes.push({x, y, v: 38});
               }
           }
           for (const c of changes) map[c.x][c.y] = c.v;
       }

       function stampSandCircle(ccx, ccy, rx, ry, ang) {
           const cos = Math.cos(ang), sin = Math.sin(ang);
           const reach = Math.ceil(Math.max(rx, ry)) + 1;
           for (let x2 = Math.max(0, Math.floor(ccx - reach)); x2 <= Math.min(MAP_W - 1, Math.ceil(ccx + reach)); x2++) {
               for (let y2 = Math.max(0, Math.floor(ccy - reach)); y2 <= Math.min(MAP_H - 1, Math.ceil(ccy + reach)); y2++) {
                   const v = map[x2][y2];
                   if (v === 2 || v === 30 || v === 22 || v === 7 || v === 33 || v === 34) continue;  // don't overwrite water/void/meadow
                   const dx = x2 + 0.5 - ccx, dy = y2 + 0.5 - ccy;
                   const u = (dx * cos + dy * sin) / rx, v2 = (-dx * sin + dy * cos) / ry;
                   if (u * u + v2 * v2 <= 1) map[x2][y2] = 39;   // sand floor
               }
           }
       }
   }

   // Water absorbs void: any void tile (30) adjacent to water (2) becomes water (2).
   // Runs once after generation. Also runs continuously in update() so player-dug void next to water fills.
   function waterAbsorbVoid() {
       let toConvert = [];
       for (let x = 0; x < MAP_W; x++) { for (let y = 0; y < MAP_H; y++) {
           if (map[x][y] !== 30) continue;
           // check 4 neighbours for water
           if ((x > 0 && map[x-1][y] === 2) || (x < MAP_W-1 && map[x+1][y] === 2) ||
               (y > 0 && map[x][y-1] === 2) || (y < MAP_H-1 && map[x][y+1] === 2)) {
               toConvert.push({x, y});
           }
       }}
       toConvert.forEach(p => map[p.x][p.y] = 2);
   }

   // Wood surrounded by void (all 4 sides are void) turns into void — the wood falls into the hole.
   function voidSwallowWood() {
       let toConvert = [];
       for (let x = 0; x < MAP_W; x++) { for (let y = 0; y < MAP_H; y++) {
           if (map[x][y] !== 20) continue;
           // check 4 neighbours — all must be void (30) or water (2 counts as void-like)
           const l = x > 0 ? map[x-1][y] : 0;
           const r = x < MAP_W-1 ? map[x+1][y] : 0;
           const u = y > 0 ? map[x][y-1] : 0;
           const d = y < MAP_H-1 ? map[x][y+1] : 0;
           if ((l === 30 || l === 2) && (r === 30 || r === 2) && (u === 30 || u === 2) && (d === 30 || d === 2)) {
               toConvert.push({x, y});
           }
       }}
       toConvert.forEach(p => map[p.x][p.y] = 30);
   }
