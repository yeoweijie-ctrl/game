                   beamGrad.addColorStop(0.5, 'rgba(255,255,255,' + (beamFlicker * 0.5).toFixed(2) + ')');
                   beamGrad.addColorStop(1, 'rgba(255,255,240,' + (beamFlicker * 0.15).toFixed(2) + ')');
                   ctx.fillStyle = beamGrad;
                   ctx.fillRect(sx + 6, sy, TILE_SIZE - 12, TILE_SIZE);
               } else if (map[x][y] === 30) {
                   // void: deep hole with faint warm light glowing from the bottom (like a dimly lit pit).
                   // Wall shadows elsewhere are unchanged — this only affects the void tile itself.
                   // 1. base fill: pure black (the depth of the hole)
                   fillTile(sx, sy, '#000');
                   // 2. vertical gradient: transparent at top, soft warm amber glow at the very bottom,
                   //    simulating light shining upward from below the void.
                   const voidGrad = ctx.createLinearGradient(sx, sy, sx, sy + TILE_SIZE);
                   voidGrad.addColorStop(0,    'rgba(0, 0, 0, 0)');          // top: just black
                   voidGrad.addColorStop(0.55, 'rgba(0, 0, 0, 0)');          // mid: still dark
                   voidGrad.addColorStop(0.85, 'rgba(90, 50, 10, 0.30)');    // near bottom: faint amber
                   voidGrad.addColorStop(1,    'rgba(140, 80, 25, 0.55)');   // very bottom: stronger glow
                   ctx.fillStyle = voidGrad;
                   ctx.fillRect(sx, sy, TILE_SIZE, TILE_SIZE);
                   // 3. a small bright glow line at the very bottom edge to suggest the light source
                   ctx.fillStyle = 'rgba(180, 110, 40, 0.45)';
                   ctx.fillRect(sx, sy + TILE_SIZE - 2, TILE_SIZE, 2);
               }
           }
       }

       drawWaterFoam(startX, startY, endX, endY);   // shoreline foam on top of the tiles, under the dirt rims

       // dirt rims on every non-wall tile that touches a wall — skip meadow tiles (33/34) for a cleaner look
       for (let x = startX; x < endX; x++) {
           for (let y = startY; y < endY; y++) {
               const v = map[x][y];
               if (v === 33 || v === 34) continue;   // no rims in the meadow biome
               if (!isDirtBlock(x, y)) drawDirtRim(x, y, Math.floor(x * TILE_SIZE - camera.x), Math.floor(y * TILE_SIZE - camera.y));
           }
       }

       droppedItems.forEach(item => {
           let screenX = item.x - camera.x; let screenY = item.y - camera.y;
           if (screenX < -20 || screenX > canvas.width / ZOOM + 20 || screenY < -20 || screenY > canvas.height / ZOOM + 20) return;
           // pop animation: item scales up from 0.4 to 1.0 over the first ~0.3s, with a slight overshoot
           const popScale = item.pop > 0 ? (1 - item.pop) * 1.15 + 0.4 : 1;
           const size = 12 * item.life * popScale; 
           ctx.save(); ctx.translate(screenX, screenY); ctx.rotate(Math.PI / 4); 
           ctx.fillStyle = getOreColor(item.type); ctx.fillRect(-size/2, -size/2, size, size);
           ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(-size/2, -size/2, size, size);
           ctx.restore();
       });

       // break particles: small debris squares that fly out, fall, and fade. Poof = expanding circle
       // (dust cloud). Ring = hollow expanding circle (shockwave). Implode = small dark squares sucked in.
       particles.forEach(p => {
           const sx = p.x - camera.x - camOffsetX, sy = p.y - camera.y - camOffsetY;
           if (sx < -30 || sx > canvas.width / ZOOM + 30 || sy < -30 || sy > canvas.height / ZOOM + 30) return;
           ctx.globalAlpha = Math.max(0, p.life);
           if (p.ring) {
               // shockwave: hollow circle outline that expands
               ctx.strokeStyle = p.color;
               ctx.lineWidth = 2;
               ctx.beginPath();
               ctx.arc(sx, sy, p.size, 0, Math.PI * 2);
               ctx.stroke();
           } else if (p.poof) {
               // expanding dust cloud: soft circle that grows and fades
               ctx.fillStyle = p.color;
               ctx.beginPath();
               ctx.arc(sx, sy, p.size, 0, Math.PI * 2);
               ctx.fill();
           } else {
               ctx.fillStyle = p.color;
               ctx.fillRect(sx - p.size/2, sy - p.size/2, p.size, p.size);
           }
           ctx.globalAlpha = 1;
       });

       // mining visual: progressive cracks (texture overlays) + vibration on each hit. The tile stays
       // visible (light passes through) so the player can see the cracks grow. Vibration is a short
       // horizontal shake on each hit.
       if (mode === 'human' && mining.tx >= 0 && !mining.isWood) {
           const msx = Math.floor(mining.tx * TILE_SIZE - camera.x - camOffsetX);
           const msy = Math.floor(mining.ty * TILE_SIZE - camera.y - camOffsetY);
           // vibration: horizontal shake that decays after each hit (hitFlash goes 0.22 -> 0)
           const vAmp = mining.hitFlash > 0 ? mining.hitFlash * 10 : 0;
           const vFreq = 40;
           const vT = performance.now() / 1000;
           const vox = vAmp > 0 ? Math.sin(vT * vFreq * 6.283) * vAmp : 0;
           // clear the static tile and redraw at the shake offset (only when vibrating)
           if (vox !== 0) {
               ctx.fillStyle = '#000';
               ctx.fillRect(msx, msy, TILE_SIZE, TILE_SIZE);
               const v = map[mining.tx][mining.ty];
               if (v === 0 || v === 21) drawDirtTile(mining.tx, mining.ty, msx + vox, msy);
               else if (v === 8 || v === 9 || (v >= 3 && v <= 6)) fillTile(msx + vox, msy, getOreColor(v));
               else if (v === 20) drawWoodTile(mining.tx, mining.ty, msx + vox, msy);
               else fillTile(msx + vox, msy, '#6b4a24');
           }
           // progressive crack textures: hit 1 = crackTex2 (light), hit 2 = crackTex1 (heavy),
           // hit 3+ = both overlaid for maximum damage. Each stage also gets darker.
           const stage = mining.hits;
           const drawX = msx + (vox !== 0 ? vox : 0);
           if (stage > 0) {
               ctx.save();
               // stage 3+: darken the tile underneath so it looks about to shatter
               if (stage >= 3) {
                   ctx.fillStyle = 'rgba(0,0,0,0.25)';
                   ctx.fillRect(drawX, msy, TILE_SIZE, TILE_SIZE);
               }
               // draw crack textures with increasing opacity per stage
               if (crackTex2Ready && stage >= 1) {
                   ctx.globalAlpha = stage >= 3 ? 0.95 : 0.80;
                   ctx.drawImage(crackTex2, drawX, msy, TILE_SIZE, TILE_SIZE);
               }
               if (crackTex1Ready && stage >= 2) {
                   ctx.globalAlpha = stage >= 3 ? 0.90 : 0.75;
                   ctx.drawImage(crackTex1, drawX, msy, TILE_SIZE, TILE_SIZE);
               }
               ctx.globalAlpha = 1;
               ctx.restore();
           }
           // ore mining glow: coal and iron glow from 4 light points (the 4 ore spots on the texture).
           // First draw the dirt texture as background, then the ore color, then the texture overlay,
           // then 4 radial light points at the quadrant centers. In the dirt biome the glow is much
           // brighter (coal 10x, iron 3x). The light points pulse softly.
           const oreV = map[mining.tx][mining.ty];
           const inDirt = isInnerZone(mining.tx, mining.ty);
           const coalMult = inDirt ? 10 : 1;
           const ironMult = inDirt ? 3 : 1;
           const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 100);
           // 4 light points at the centers of the 4 quadrants of the 32x32 tile
           const lightPoints = [[8, 8], [24, 8], [8, 24], [24, 24]];
           if (oreV === 8 && coalMineTexReady) {
               drawDirtTile(mining.tx, mining.ty, drawX, msy);
               fillTile(drawX, msy, getOreColor(8));
               ctx.save();
               ctx.globalCompositeOperation = 'lighter';
               ctx.globalAlpha = Math.min(1, pulse * 0.8);
               for (let i = 0; i < coalMult; i++) ctx.drawImage(coalMineTex, drawX, msy, TILE_SIZE, TILE_SIZE);
               // 4 glowing light points (warm orange for coal)
               for (const [lx, ly] of lightPoints) {
                   const grad = ctx.createRadialGradient(drawX + lx, msy + ly, 0, drawX + lx, msy + ly, 7);
                   grad.addColorStop(0, 'rgba(255,200,100,' + Math.min(1, pulse).toFixed(2) + ')');
                   grad.addColorStop(1, 'rgba(255,200,100,0)');
                   ctx.fillStyle = grad;
                   ctx.globalAlpha = inDirt ? 1 : 0.5;
                   ctx.fillRect(drawX + lx - 7, msy + ly - 7, 14, 14);
               }
               ctx.restore();
           } else if (oreV === 9 && ironMineTexReady) {
               drawDirtTile(mining.tx, mining.ty, drawX, msy);
               fillTile(drawX, msy, getOreColor(9));
               ctx.save();
               ctx.globalCompositeOperation = 'lighter';
               ctx.globalAlpha = Math.min(1, pulse * 0.8);
               for (let i = 0; i < ironMult; i++) ctx.drawImage(ironMineTex, drawX, msy, TILE_SIZE, TILE_SIZE);
               // 4 glowing light points (cool white for iron)
               for (const [lx, ly] of lightPoints) {
                   const grad = ctx.createRadialGradient(drawX + lx, msy + ly, 0, drawX + lx, msy + ly, 7);
                   grad.addColorStop(0, 'rgba(220,230,240,' + Math.min(1, pulse).toFixed(2) + ')');
                   grad.addColorStop(1, 'rgba(220,230,240,0)');
                   ctx.fillStyle = grad;
                   ctx.globalAlpha = inDirt ? 1 : 0.5;
                   ctx.fillRect(drawX + lx - 7, msy + ly - 7, 14, 14);
               }
               ctx.restore();
           }
       }
       // wood mining visual: vibration only for fist mining (woodTimer > 0). Pickaxe mining uses hits
       // + crack textures (like dirt), no vibration. Sword mining is instant, no visual needed.
       if (mode === 'human' && mining.tx >= 0 && mining.isWood) {
           const msx = Math.floor(mining.tx * TILE_SIZE - camera.x - camOffsetX);
           const msy = Math.floor(mining.ty * TILE_SIZE - camera.y - camOffsetY);
           // fist mining: subtle shake based on woodTimer
           if (mining.woodTimer > 0) {
               const wp = mining.woodTimer / WOOD_TIME;
               const amp = wp * 1.5;
               const t = performance.now() / 1000;
               const ox = Math.sin(t * 30 * 6.283) * amp;
               if (ox !== 0) {
                   ctx.fillStyle = '#000'; ctx.fillRect(msx, msy, TILE_SIZE, TILE_SIZE);
                   drawWoodTile(mining.tx, mining.ty, msx + ox, msy);
               }
           }
           // pickaxe mining wood: no crack textures, no vibration — just the swing animation
       }

       let cx = (canvas.width / 2) / ZOOM; let cy = (canvas.height / 2) / ZOOM;

       // --- Tool visual (human mode) ---
       // Pickaxe or sword, depending on the selected hotbar item. Both point toward the cursor and
       // swing in an arc when mining. Drawn in the world context (translated by -camOffset).
       if (mode === 'human') {
           const baseAngle = Math.atan2(mouse.y - canvas.height / 2, mouse.x - canvas.width / 2);
           const hasSword = inventory[selectedSlot] && inventory[selectedSlot].type === 17;
           const hasShovel = inventory[selectedSlot] && inventory[selectedSlot].type === 23;
           let swingOffset = 0;
           if (mining.tx >= 0) {
               const sp = mining.swingTimer / SWING_TIME;
               swingOffset = Math.sin(sp * Math.PI) * 1.1;   // swings ~63° to the side then back
           }
           const angle = baseAngle + swingOffset;
           // tool starts at the EDGE of the player's hitbox (in front of the box), not the center.
           // Drawn in the translated world context, so it shifts with the player and walls.
           const startX = cx + Math.cos(angle) * PLAYER_HALF;
           const startY = cy + Math.sin(angle) * PLAYER_HALF;
           if (hasSword) {
               // Sword: long blade pointing toward cursor, with a guard and handle
               const bladeLen = 20, bladeW = 3, guardW = 8;
               const tipX = startX + Math.cos(angle) * bladeLen;
               const tipY = startY + Math.sin(angle) * bladeLen;
               const guardX = startX + Math.cos(angle) * 6;
               const guardY = startY + Math.sin(angle) * 6;
               const perpX = Math.cos(angle + Math.PI / 2), perpY = Math.sin(angle + Math.PI / 2);
               // blade (silver)
               ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = bladeW; ctx.lineCap = 'round';
               ctx.beginPath(); ctx.moveTo(guardX, guardY); ctx.lineTo(tipX, tipY); ctx.stroke();
               // tip (pointed)
               ctx.fillStyle = '#e2e8f0';
               ctx.beginPath(); ctx.arc(tipX, tipY, bladeW / 2, 0, Math.PI * 2); ctx.fill();
               // guard (dark grey, perpendicular)
               ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
               ctx.beginPath(); ctx.moveTo(guardX + perpX * guardW, guardY + perpY * guardW);
               ctx.lineTo(guardX - perpX * guardW, guardY - perpY * guardW); ctx.stroke();
               // handle (brown, behind guard)
               ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 3;
               ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(guardX, guardY); ctx.stroke();
           } else if (hasShovel) {
               // Shovel: handle + spade head (trapezoid pointing toward cursor)
               const handleLen = 16;
               const hx = startX + Math.cos(angle) * handleLen;
               const hy = startY + Math.sin(angle) * handleLen;
               ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
               ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(hx, hy); ctx.stroke();
               const fwdX = Math.cos(angle), fwdY = Math.sin(angle);
               const perpX = Math.cos(angle + Math.PI / 2), perpY = Math.sin(angle + Math.PI / 2);
               ctx.fillStyle = '#a16207';
               ctx.beginPath();
               ctx.moveTo(hx + perpX * 4, hy + perpY * 4);
               ctx.lineTo(hx - perpX * 4, hy - perpY * 4);
               ctx.lineTo(hx - perpX * 5 + fwdX * 6, hy - perpY * 5 + fwdY * 6);
               ctx.lineTo(hx + perpX * 5 + fwdX * 6, hy + perpY * 5 + fwdY * 6);
               ctx.closePath(); ctx.fill();
               ctx.strokeStyle = '#57534e'; ctx.lineWidth = 1; ctx.stroke();
           } else {
               // Pickaxe: handle + perpendicular head
               const handleLen = 16;
               const headSize = 7;
               const hx = startX + Math.cos(angle) * handleLen;
               const hy = startY + Math.sin(angle) * handleLen;
               ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
               ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(hx, hy); ctx.stroke();
               const perpX = Math.cos(angle + Math.PI / 2), perpY = Math.sin(angle + Math.PI / 2);
               const fwdX = Math.cos(angle), fwdY = Math.sin(angle);
               ctx.fillStyle = '#9ca3af';
               ctx.beginPath();
               ctx.moveTo(hx + perpX * headSize, hy + perpY * headSize);
               ctx.lineTo(hx - perpX * headSize, hy - perpY * headSize);
               ctx.lineTo(hx - perpX * headSize + fwdX * 5, hy - perpY * headSize + fwdY * 5);
               ctx.lineTo(hx + perpX * headSize + fwdX * 5, hy + perpY * headSize + fwdY * 5);
               ctx.closePath(); ctx.fill();
               ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 1; ctx.stroke();
           }
       }

       // human mode: light around the player that is blocked by walls, everything else dark.
       // The light is drawn at the player's SCREEN position (which shifts with the camera offset, same as
       // the walls) so shadows stay attached to the walls. The rays cast from the player's WORLD position
       // (which doesn't shift) so shadow angles are correct.
       if (mode === 'human') drawLighting((canvas.width / 2) / ZOOM - camOffsetX, (canvas.height / 2) / ZOOM - camOffsetY);

       // ore glow: ores dimly glow in the dark so they're visible even outside the light radius.
       // Drawn AFTER the lighting overlay so the glow shows through the darkness.
       // Coal glows 10x brighter than other ores (drawn 10 times with additive blending).
       if (mode === 'human') {
           for (let x = startX; x < endX; x++) {
               for (let y = startY; y < endY; y++) {
                   const v = map[x][y];
                   if (v !== 8 && v !== 9 && !(v >= 3 && v <= 6)) continue;   // only ores
                   const sx = Math.floor(x * TILE_SIZE - camera.x + TILE_SIZE / 2);
                   const sy = Math.floor(y * TILE_SIZE - camera.y + TILE_SIZE / 2);
                   const glowColor = getOreColor(v);
                   const isCoal = v === 8;
                   const passes = isCoal ? 10 : 1;
                   ctx.save();
                   ctx.globalCompositeOperation = 'lighter';
                   for (let i = 0; i < passes; i++) {
                       const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 14);
                       grad.addColorStop(0, glowColor + 'cc');    // 80% opacity at center
                       grad.addColorStop(0.5, glowColor + '55');  // 33% opacity mid
                       grad.addColorStop(1, glowColor + '00');    // transparent at edge
                       ctx.fillStyle = grad;
                       ctx.fillRect(sx - 14, sy - 14, 28, 28);
                   }
                   ctx.restore();
               }
           }
       }

       // player hitbox: solid red square (2/3 tile, centered on the player).
       // Drawn at the player's screen position (cx, cy in the translated world context = screen center
       // in world coords). The world is translated by -camOffset, so the player shifts with the walls
       // and stays aligned with the light source.
       ctx.fillStyle = 'red';
       ctx.fillRect(cx - PLAYER_HALF, cy - PLAYER_HALF, PLAYER_HITBOX, PLAYER_HITBOX);

       ctx.restore();                         // back to normal scale

       // --- Crosshair cursor (+) at the mouse position ---
       // Drawn in screen space (after restore) so it stays sharp at the exact mouse pixel.
       ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
       ctx.beginPath();
       ctx.moveTo(mouse.x - 8, mouse.y); ctx.lineTo(mouse.x - 3, mouse.y);   // left arm
       ctx.moveTo(mouse.x + 3, mouse.y); ctx.lineTo(mouse.x + 8, mouse.y);   // right arm
       ctx.moveTo(mouse.x, mouse.y - 8); ctx.lineTo(mouse.x, mouse.y - 3);   // top arm
       ctx.moveTo(mouse.x, mouse.y + 3); ctx.lineTo(mouse.x, mouse.y + 8);   // bottom arm
       ctx.stroke();
       ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1;
       ctx.stroke();   // dark outline so it's visible on light backgrounds
   }


   function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }


   setTimeout(() => {
       initMap(); runCellularAutomata(); clusterOreVeins(); connectNearbyWhiteTiles(); carveSpawnRoom();
       generateLakes(); engulfSurroundedWhiteTiles(); smoothWaterEdges(); generateOre(); generateWood();
       generateMeadow();   // generate meadow sub-biome (25% of dirt biome, golden grass)
       generateVoidPatches();   // generate void floor patches (like water, but it's a hole)
       for (let i = 0; i < 10; i++) voidBridge();   // merge nearby void patches (10 passes during generation only)
       waterAbsorbVoid();       // void adjacent to water becomes water
       // Carve everything outside the stone ring (radius 300) into SAND — the world is a dirt+stone disc
       // floating in an infinite sand desert. The stone ring is the crust, wider than the dirt pizza.
       {
           const cx = Math.floor(MAP_W / 2), cy = Math.floor(MAP_H / 2);
           for (let x = 0; x < MAP_W; x++) for (let y = 0; y < MAP_H; y++) {
               if (Math.hypot(x + 0.5 - cx, y + 0.5 - cy) > STONE_RING_RADIUS) {
                   map[x][y] = 39;   // sand floor (was 30 = void)
               }
           }
       }
       teleportFromWaterIfNeeded();   // if spawn ended up in water, move to nearest land
      
       generating = false;
       // give the player a pickaxe (slot 0) and a sword (slot 1) at game start
       inventory[0] = { type: 16, count: 1 };
       inventory[1] = { type: 17, count: 1 };
       inventory[2] = { type: 18, count: 1 };   // torch (infinite — placement doesn't consume it)
       inventory[3] = { type: 23, count: 1 };   // shovel (dig floor → void)
       inventory[4] = { type: 24, count: 16 };  // stone blocks (place on floor → wall, on void → floor)
       inventory[5] = { type: 35, count: 16 };  // meadow blocks (place on floor → meadow wall, on void → meadow floor)
       inventory[6] = { type: 37, count: 16 };  // sand blocks (place on floor → sand wall, on void → sand floor)
       selectedSlot = 0;
       document.getElementById('loading').style.display = 'none';
       updateAllVisuals(); 
       gameLoop();
   }, 50);


</script>
</body>
